appId: com.whydiff.desktop
productName: whydiff
directories:
  output: release
  buildResources: build

# The renderer/main/preload are built by electron-vite into out/.
files:
  - out/**
  - package.json

# pdfjs-dist is ESM-only and is loaded by a runtime dynamic import() in the main process
# (see pdf-annotate.mjs). Keep it on the real filesystem (app.asar.unpacked) rather than
# inside the asar archive, so the ESM loader resolves it reliably when packaged.
asarUnpack:
  - "**/node_modules/pdfjs-dist/**"

# The app shells out to the whydiff plugin's own scripts, so the plugin has to ride
# inside the packaged app (in dev it uses the repo root instead). We ship the pieces
# a run needs — its scripts, the viewer template, the agents/skills/hooks the plugin
# loads, the schema, and mermaid for the assembler. `claude`, `git` and the model
# come from the user's machine (whydiff needs Claude Code installed anyway).
extraResources:
  - from: ../scripts
    to: whydiff-plugin/scripts
  - from: ../templates
    to: whydiff-plugin/templates
  - from: ../agents
    to: whydiff-plugin/agents
  - from: ../skills
    to: whydiff-plugin/skills
  - from: ../schema
    to: whydiff-plugin/schema
  - from: ../hooks
    to: whydiff-plugin/hooks
  - from: ../.claude-plugin
    to: whydiff-plugin/.claude-plugin
  - from: ../node_modules/mermaid
    to: whydiff-plugin/node_modules/mermaid
  - from: ../node_modules/@highlightjs/cdn-assets
    to: whydiff-plugin/node_modules/@highlightjs/cdn-assets

# Unsigned across the board (see docs/desktop-app.md, Phase 6): no cost, Gatekeeper /
# SmartScreen warn once. Signing + notarisation + auto-update come later.
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  gatekeeperAssess: false
  # Version-less, OS+arch-stable names so the viewer's "Download the app" link can point at
  # https://github.com/smagew/whydiff/releases/download/app-latest/whydiff-mac-<arch>.dmg
  # (the moving app-latest release published by desktop.yml) and always resolve to the newest
  # build. Keep these names in sync with appDownloadUrl() in templates/viewer.html.
  artifactName: whydiff-mac-${arch}.${ext}
# Free ad-hoc signing (no Apple Developer account). electron-builder can't do it —
# it reads mac.identity as a keychain name and skips when none matches, leaving the
# linker-signed placeholder that ships "damaged". So we sign the whole bundle
# ourselves after packing: `codesign --deep --force --sign -`. This is a real ad-hoc
# signature over our bundle id; notarisation (removing the Gatekeeper prompt entirely)
# still needs the paid Developer ID.
afterPack: build/afterPack.cjs
linux:
  target: [AppImage, deb]
  category: Development
  # The .deb target needs a maintainer with an email.
  maintainer: whydiff <ag@coding.lt>
  artifactName: whydiff-linux-${arch}.${ext}
win:
  target: [nsis]
  artifactName: whydiff-win-${arch}.${ext}
