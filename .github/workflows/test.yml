name: test

# Runs the full check suite on every PR into main. The 0.11.0 design-system
# regressions merged because these tests were never a gate — now they are.
# (claude plugin validate is left out: it needs the Claude CLI, not available here.)
on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: contract validation
        run: node scripts/validate.mjs examples/rate-limit/review-map.json
      - name: tests (unit + design + smoke + serve)
        run: npm test
