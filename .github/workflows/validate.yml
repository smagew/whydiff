name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate plugin and marketplace manifests
        run: npx --yes @anthropic-ai/claude-code plugin validate .

      - name: Validate the reference example against the schema contract
        run: node scripts/validate.mjs examples/rate-limit/review-map.json

      - name: Browser smoke test + coverage gate (assemble + clickable diagrams)
        run: |
          npx playwright install --with-deps chromium
          npm run coverage   # runs the full suite under c8 and fails below the floor
