name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate plugin and marketplace manifests
        run: npx --yes @anthropic-ai/claude-code plugin validate .

      - name: Validate the reference example against the schema contract
        run: node scripts/validate.mjs examples/rate-limit/review-map.json

      - name: Browser smoke test + coverage gate (assemble + clickable diagrams)
        run: |
          npx playwright install --with-deps chromium
          npm run coverage   # runs the full suite under c8 and fails below the floor

  # The desktop app has its own package + tests (main-process modules + renderer logic).
  # They are network-free and need only node + git, so they gate PRs cheaply alongside
  # the plugin suite. The app is built/released separately in desktop.yml.
  app-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        run: npm ci
        working-directory: app
      - name: Run app tests (main modules + renderer logic)
        run: npm test
        working-directory: app

  # The PDF-comments end-to-end spans both dep trees (playwright from the plugin, pdf-lib/pdfjs
  # from app/) and drives real Chromium page.pdf() → annotatePdf, so it lives in its own job
  # that installs both. It is the guard that a review note actually becomes a real PDF comment
  # on the right page through a real print — see docs/pdf-export.md.
  pdf-comments-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install plugin dependencies
        run: npm ci
      - name: Install app dependencies
        run: npm ci
        working-directory: app
      - name: End-to-end PDF comments (real Chromium print → annotate)
        run: |
          npx playwright install --with-deps chromium
          make pdf-e2e
