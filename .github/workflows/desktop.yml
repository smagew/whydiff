name: desktop

# Build the desktop app (app/) for macOS, Linux and Windows on their own runners —
# the reliable way to get all three, since they can't be cross-built from one OS.
# Unsigned (see docs/desktop-app.md, Phase 6): the artifacts open with a one-time
# "unidentified developer" / SmartScreen warning.
#
# Push a tag `app-vX.Y.Z` → build all three AND publish a GitHub Release with the
# installers attached. A manual run just builds + uploads them as run artifacts (no
# release), for testing.
on:
  workflow_dispatch:
  push:
    tags: ['app-v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flag: --mac
          - os: ubuntu-latest
            flag: --linux
          - os: windows-latest
            flag: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Root deps provide mermaid, which the app bundles for the assembler.
      - run: npm install
      - run: npm ci
        working-directory: app
      # On a release tag, stamp app/package.json with the tag's version so the
      # installer filenames (whydiff-X.Y.Z.*) match the GitHub Release.
      - name: sync app version to the tag
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        working-directory: app
        run: |
          V="${GITHUB_REF_NAME#app-v}"
          node -e "const fs=require('fs'),p=require('./package.json');p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$V"
          echo "app version → $V"
      - name: build + package (unsigned)
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # never try to sign
        run: npx electron-vite build && npx electron-builder ${{ matrix.flag }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: whydiff-${{ matrix.os }}
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.AppImage
            app/release/*.deb
            app/release/*.exe
          if-no-files-found: warn

  # On a tag, gather every OS's installers and publish them in one GitHub Release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets (uses the default GITHUB_TOKEN)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist # each build job's artifact lands under dist/<name>/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          fail_on_unmatched_files: false
          name: whydiff desktop ${{ github.ref_name }}
          body: |
            Unsigned desktop builds of whydiff.

            - **macOS**: `.dmg` (or `.zip`). First launch: right-click the app → **Open** (Gatekeeper, because it is unsigned).
            - **Windows**: the `.exe` installer. SmartScreen may warn ("unknown publisher") — **More info → Run anyway**.
            - **Linux**: `.AppImage` (portable, `chmod +x` then run) or `.deb`.

            Requires Claude Code (`claude`) and `git` installed — the app drives them to produce the map.
