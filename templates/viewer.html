<!doctype html>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
  /* ── tokens ────────────────────────────────────────────────────────────────
     The only place hex may appear. Everything below refers to these by name.
     Legacy names (--bg, --surface, --muted, --p1…) are kept as ALIASES so a
     rule that has not been revisited still resolves to a token rather than to
     an old hardcoded value. */
  /* ── tokens ────────────────────────────────────────────────────────────────
     The only place a hex may appear; tests/design.mjs fails the build otherwise.
     Three palettes, exactly one of which ships — graphite by default. Legacy names
     (--bg, --surface, --muted, --p1…) are aliases so no rule can resolve to a
     stale literal. */
  /* graphite is the shipped default, so it sits on :root; slate and bond come
     AFTER it and override when their attribute is set (equal specificity → source
     order decides, and :root always matches <html> whatever data-p says). */
  :root, [data-p="graphite"] {       /* dark-first, brass — ships by default */
    --canvas:#14161A; --panel:#1E2126; --sunken:#0F1113;
    --line:#31363D;   --line-strong:#454B53;
    --ink:#DDE1E6;    --ink-2:#C3C9D0;  --ink-3:#8E969E;
    --mark:#C9A227;   --flag:#D2635A;   --flag-soft:#2B1F1C;
    --pass:#6DB98C;   --caution:#CBA23E;
    --add-bg:#182530; --add-edge:#4F7EA8; --add-ink:#C3D7E8;
    --del-bg:#2B1F1C; --del-edge:#A5634E; --del-ink:#E4C8BC;
    --mark-ink:#14161A;
    /* syntax highlighting — muted, few-hue, tuned to this palette */
    --syn-key:#C0A0D0; --syn-str:#9DBE8C; --syn-num:#D6B487; --syn-fn:#8FB6D9; --syn-type:#86C0B4;
  }
  [data-p="slate"] {                 /* slate — monochrome, one signal colour */
    --canvas:#EEF0F2; --panel:#F8F9FA; --sunken:#E4E7EA;
    --line:#D5D9DC;   --line-strong:#BEC3C8;
    /* Spec value #15181B measures 15.6:1 on canvas and 16.9:1 on panel, above
       the 10–14 ceiling §2 sets. #282D31 lands at 12.2 / 13.2. --mark keeps the
       original value: it is a signal, not body text, so the ceiling is not its
       constraint, and the two staying distinct is what makes weight read. */
    --ink:#282D31;    --ink-2:#4A5054;  --ink-3:#5C6368;
    --mark:#15181B;   --flag:#8A2B3D;   --flag-soft:#EFE3E5;
    --pass:#2F6E4E;   --caution:#8A5E1E;
    --add-bg:#E1E7EE; --add-edge:#3B5F87; --add-ink:#17324D;
    --del-bg:#EFE3E5; --del-edge:#8A2B3D; --del-ink:#4A1620;
    --mark-ink:#F8F9FA;
    --syn-key:#5B3B87; --syn-str:#3F6B45; --syn-num:#8A5A2B; --syn-fn:#2E5A87; --syn-type:#2E6E63;
  }
  [data-p="bond"] {                  /* neutral near-white, plum */
    --canvas:#FBFBF9; --panel:#FFFFFF; --sunken:#F0F0EE;
    --line:#E2E2DF;   --line-strong:#C9C9C5;
    /* #191919 measures 17.0:1 on canvas; #2F2F2E lands at 12.9 / 13.4. */
    --ink:#2F2F2E;    --ink-2:#3D3D3B;  --ink-3:#62625F;
    --mark:#5B2B4A;   --flag:#8F2A2A;   --flag-soft:#F5EAEA;
    --pass:#2F6E4E;   --caution:#8A5E1E;
    --add-bg:#EAEFF4; --add-edge:#3E6389; --add-ink:#17324D;
    --del-bg:#F5EAEA; --del-edge:#8F2A2A; --del-ink:#4A1616;
    --mark-ink:#FFFFFF;
    --syn-key:#6E3E7A; --syn-str:#3F6B45; --syn-num:#8A5A2B; --syn-fn:#2E5A87; --syn-type:#2E6E63;
  }
  /* quiet — what ships. One diff hue, and it sits on the side that was added.
     A removed line is gone: it needs no colour of its own, and a plate behind
     it competes with the added lines for the eye. Grey ink plus the strike the
     rule already draws says it, and the page drops from two diff hues to one.
     Values come from the palette, so quiet needs no hex and no per-palette
     override. safe (blue/terracotta) and classic (red/green) stay opt-in. */
  [data-diff="quiet"] {
    --del-bg: transparent; --del-edge: var(--ink-3); --del-ink: var(--ink-3);
  }
  /* classic red/green is opt-in; safe blue/terracotta is the two-hue fallback */
  [data-diff="classic"] {
    --add-bg:#E3EFE4; --add-edge:#3F7A46; --add-ink:#1B3D1F;
    --del-bg:#F6E5E3; --del-edge:#A44A40; --del-ink:#4A1C17;
  }
  [data-p="graphite"][data-diff="classic"] {
    --add-bg:#1B2A1D; --add-edge:#5A8F60; --add-ink:#CADFCC;
    --del-bg:#2B1F1C; --del-edge:#B0655C; --del-ink:#E8C8C3;
  }

  :root {
    /* Two families. No serif family is permitted anywhere in this file. */
    --ui:   "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

    --r-input: 3px; --r-overlay: 5px;
    --t: 140ms ease-out;
    --shadow-overlay: 0 8px 28px rgba(10,14,20,.22);
    --measure: 64ch;

    /* Group bands: tone only. A hue per group would be six more accents. */
    --p1: var(--ink-2); --p1b: var(--sunken);
    --p2: var(--ink-2); --p2b: var(--sunken);
    --p3: var(--ink-2); --p3b: var(--sunken);
    --p4: var(--ink-2); --p4b: var(--sunken);
    --p5: var(--ink-2); --p5b: var(--sunken);
    --p6: var(--ink-2); --p6b: var(--sunken);
    --p7: var(--ink-2); --p7b: var(--sunken);
    --p8: var(--ink-2); --p8b: var(--sunken);

    /* aliases: old names, current values */
    --bg: var(--canvas); --surface: var(--panel); --surface-2: var(--sunken);
    --muted: var(--ink-2); --code-bg: var(--sunken);
    --accent: var(--mark); --accent-bg: var(--sunken); --accent-ink: var(--mark-ink);
    --accent-soft: var(--sunken);
    --add: var(--add-edge); --del: var(--del-edge);
    --ok: var(--mark); --ok-bg: var(--sunken);
    --warn: var(--flag); --warn-bg: var(--flag-soft);
    --flag-bg: var(--flag-soft);
    --info: var(--ink-2); --info-bg: var(--sunken);
    --shadow: none;
    --font-ui: var(--ui); --font-mono: var(--mono); --font-prose: var(--ui);
    --sans: var(--ui); --r-btn: 3px; --r-panel: 3px;
  }

  * { box-sizing: border-box; }
  /* Reserve the scrollbar's width always, so switching to a tab that does not
     scroll does not widen the page by ~15px and shift everything sideways. */
  html { scrollbar-gutter: stable; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font-ui); font-size: 14px;
    line-height: 1.45; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1360px; margin: 0 auto; padding: 28px 24px 64px; position: relative; }
  /* Quick palette switch — three swatches in the top-right corner, each painted in
     its own palette's canvas + accent so it reads as a theme, not a button. */
  .themepick { position: absolute; top: 24px; right: 24px; display: inline-flex; gap: 5px; z-index: 6; }
  .themepick button { width: 20px; height: 20px; padding: 0; cursor: pointer; border-radius: 5px;
    border: 1px solid var(--line); background: var(--sw-bg); position: relative; overflow: hidden;
    transition: transform var(--t), box-shadow var(--t); }
  .themepick button::after { content: ''; position: absolute; right: 3px; bottom: 3px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--sw-fg); }
  /* A ring and a lift, not shadows: this design system has none outside overlays,
     and its own test enforces that. An outline draws the same ring without one. */
  .themepick button:hover { transform: translateY(-1px); border-color: var(--accent); }
  .themepick button.on { outline: 2px solid var(--accent); outline-offset: 2px; }
  .themepick button:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; }
  body.focus .themepick { display: none; }

  /* ── type ──────────────────────────────────────────────────────────────────
     Two families only. Everything readable is --ui; code, paths, ids, labels and
     numbers are --mono. Prose is separated from code by measure and leading,
     never by a third family. */
  .prose { font-size: 16px; line-height: 1.62; max-width: var(--measure); }
  .prose code, .mono, code, pre { font-family: var(--font-mono); }
  h1, h2, h3 { font-weight: 500; }
  ::selection { background: var(--accent-bg); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 3px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  /* Human-written prose, wherever it appears: the causal story, the per-file
     explanations, findings, stories, and the answers in a thread. */
  .step-text, .branch, .why, .uwhy, .utext, .finding .fbody, .section-note,
  .listcard li, .bwhy, .dk-a, .dk-q, .cap, .tests-note {
    font-size: 15.5px; line-height: 1.6; }
  .step-text, .why, .finding .fbody, .section-note, .bwhy { max-width: var(--measure); }
  .step-text code, .branch code, .why code, .uwhy code, .finding code, .dk-a code,
  .section-note code, .listcard li code, .bwhy code { font-family: var(--font-mono); font-size: 13px; }

  /* ── reading session ───────────────────────────────────────────────────────
     A 40-file review is several sittings, so progress, position and what has
     already been read all survive a reload. */
  .footstrip { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; align-items: center; gap: 14px;
    padding: 6px 16px; background: var(--panel); border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
  .footstrip .fs-bar { position: absolute; left: 0; top: -1px; height: 2px; background: var(--accent); transition: width var(--t); }
  .footstrip .fs-ver { font-family: var(--mono); font-size: 13px; color: var(--ink-3); }
  .footstrip .fs-keys { margin-left: auto; font-family: var(--mono); font-size: 13px; color: var(--ink-3); }
  .footstrip kbd { font-family: var(--mono); font-size: 13px; border: 1px solid var(--line); border-radius: var(--r-input);
    padding: 0 4px; background: var(--sunken); color: var(--ink-2); }
  body.can-read .wrap { padding-bottom: 76px; }

  .seen-btn { font: inherit; font-family: var(--font-mono); font-size: 13px; cursor: pointer; background: none;
    border: 1px solid var(--line); border-radius: var(--r-input); color: var(--ink-3); padding: 0 5px; }
  .seen-btn:hover { border-color: var(--line-strong); color: var(--ink-2); }
  .seen-btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  .node.seen .mpath, .mrow.seen .mpath { color: var(--ink-3); }
  .node.seen { background: var(--sunken); }
  .cursor-here { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* focus mode: only the reading column */
  body.focus .rail, body.focus .rightcol, body.focus .statbar, body.focus .scopebar { display: none !important; }
  body.focus .wrap { max-width: 900px; }
  body.focus .layout { grid-template-columns: minmax(0, 1fr) !important; }

  .keysheet { width: 100%; border-collapse: collapse; font-size: 13px; }
  .keysheet td { padding: 3px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .keysheet td:first-child { width: 88px; font-family: var(--mono); color: var(--ink-2); white-space: nowrap; }
  .setrow { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; font-size: 13px; color: var(--ink-2); }
  .setrow .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-btn); overflow: hidden; }
  .setrow .seg button { font: inherit; font-size: 13px; cursor: pointer; border: none; background: var(--panel);
    color: var(--ink-2); padding: 3px 10px; border-left: 1px solid var(--line); }
  .setrow .seg button:first-child { border-left: none; }
  .setrow .seg button.on { background: var(--accent); color: var(--accent-ink); }

  .kicker { font-family: var(--mono); font-size: 13px;  color: var(--ink-3); margin: 0 0 6px; }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 500; letter-spacing: -.01em; text-wrap: balance; }
  .sub { margin: 0; color: var(--ink-2); font-size: 16px; line-height: 1.62; max-width: var(--measure); }
  code { font-family: var(--mono); font-size: .92em; background: none; border: none; padding: 0; color: inherit; }

  .statbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 12px; }
  .scopebar { display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: center; margin: 0 0 16px; }
  /* Scope and language are context, not navigation. Boxing them made two rows of
     buttons that outweighed the tab strip underneath — the one thing on this screen
     that must read as primary. They are plain text now; only a chosen filter gets
     ink, because that is a state the reader has to see. */
  .scope-chip { font: inherit; font-size: 13px; cursor: pointer; border: none; border-radius: 3px;
    padding: 1px 4px; background: none; color: var(--ink-2); transition: color var(--t); }
  .scope-chip .cnt { font-family: var(--mono); font-size: 13px; color: var(--ink-3); margin-left: 3px; }
  .scope-chip:hover { color: var(--accent); }
  .scope-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .scope-chip.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  .scope-chip.active .cnt { color: var(--accent); }
  .scope-sep { width: 1px; height: 13px; background: var(--line); margin: 0 4px; }
  .lang-chip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 13px; color: var(--ink-3); border: none; padding: 1px 2px; }
  /* file-type badge: a short monospace type label (php/js/sql/po/tpl), a bare tag
     the design system allows (no box), fixed-width so filenames align in a gutter */
  .ficon { flex: none; align-self: center; width: 15px; height: 15px; margin-right: 8px;
    color: var(--ink-2); vertical-align: -3px; }
  .fchip .ficon, .nlink .ficon, .rel-file .ficon, .cg-node .ficon { width: 13px; height: 13px; margin-right: 5px; vertical-align: -2px; }
  .node.dim { opacity: .3; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 10px 16px; min-width: 118px; }
  .stat b { display: block; font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .stat span { font-size: 13px; color: var(--muted); }
  .stat.hl { border-color: var(--accent); }
  .stat.hl b { color: var(--accent); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, var(--rc, 440px)); gap: 20px; align-items: start; }
  /* a file drill-down carries more prose than the overview list, so the aside
     opens at half the width there — unless the reader has dragged it themselves. */
  .layout.wide { --rc: 50%; }
  @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }
  /* The right column is only written to from the Logic, Diagrams and Files tabs.
     It could collapse on the prose tabs to reclaim the width — but then the reading
     column resizes every time you switch tabs, which reads as the whole page
     jumping. Stability wins: the grid is the SAME on every tab, so the reading
     column never changes width; a prose tab leaves the reserved area empty
     rather than growing into it. A chat claims the column on every tab. */
  /* solo (a non-Code-map tab, no ask panel): reclaim the aside's reserved column so the
     reading column runs full width — a diagram fills it (prose stays capped at its
     measure, so it looks the same). A file drill-down (revealAside) drops solo and the
     aside slides back in, reflowing the column once; using the space beats keeping ~440px
     permanently empty. (An open ask panel — .chatting.solo below — still claims a column.) */
  .layout.solo { grid-template-columns: minmax(0, 1fr); }
  .layout.solo > .rightcol { display: none; }
  /* var(--rc) so the rc-grip resizes the diagram↔panel split while asking too (before,
     the ask panel's width was fixed and the grip did nothing). Floors at 380px so the
     panel stays usable; defaults to 0.92fr until you drag. */
  .layout.chatting { grid-template-columns: minmax(0, 1fr) minmax(380px, var(--rc, 0.92fr)); }
  .layout.chatting.solo { grid-template-columns: minmax(0, 1fr) minmax(380px, var(--rc, 0.92fr)); }
  .layout.chatting.solo > .rightcol { display: block; }
  .layout.chatting > .rightcol > .inspector { display: none; }
  /* .layout sets align-items:start, which would size this column to its content
     and leave a sticky child no room to travel — the panel would scroll away. */
  .rightcol { align-self: stretch; min-width: 0; position: relative; }
  /* drag the aside wider/narrower from its left edge; the pill floats at mid-height */
  .rc-grip { position: absolute; top: 0; bottom: 0; left: -14px; width: 16px; z-index: 7; cursor: col-resize; }
  .rc-grip-pill { position: sticky; top: calc(50vh - 22px); display: block; margin: 0 auto; width: 5px; height: 44px;
    border-radius: 5px; background: var(--line-strong); transition: background var(--t); }
  .rc-grip:hover .rc-grip-pill, .rc-grip.drag .rc-grip-pill { background: var(--accent); }
  @media (max-width: 960px) { .rc-grip { display: none; } }
  /* collapse the right column back into the reading width; a slim tab brings it back */
  .layout.aside-collapsed { grid-template-columns: minmax(0, 1fr); }
  .layout.aside-collapsed > .rightcol { display: none !important; }
  .aside-toggle { position: sticky; top: 20px; z-index: 6; display: block; width: fit-content;
    margin: 0 0 0 auto; font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px;
    padding: 3px 7px; color: var(--muted); }
  .aside-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .rightcol > #inspector { margin-top: -28px; }
  .aside-reopen { position: fixed; right: 0; top: 42vh; z-index: 20; writing-mode: vertical-rl;
    font: inherit; font-size: 13px; letter-spacing: .04em; cursor: pointer; color: var(--muted);
    background: var(--surface); border: 1px solid var(--line-strong); border-right: none;
    border-radius: 5px 0 0 5px; padding: 12px 6px; }
  .aside-reopen:hover { color: var(--accent); border-color: var(--accent); }
  .aside-reopen[hidden] { display: none; }

  .main-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 18px; position: relative; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 16px; }
  .tab { font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 3px; padding: 6px 13px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); transition: background var(--t), border-color var(--t), color var(--t); }
  .tab:hover { border-color: var(--accent); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tab.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tab .cnt { font-family: var(--mono); font-size: 13px; opacity: .75; margin-left: 4px; }
  .help-btn { margin-left: auto; flex: none; width: 28px; height: 28px; align-self: center; border-radius: 3px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: border-color var(--t), color var(--t); }
  .help-btn:hover { border-color: var(--accent); color: var(--accent); }
  .help-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .glegend { margin: 0 0 14px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
  .gleg-row { display: flex; align-items: baseline; gap: 8px; width: 100%; font: inherit; font-size: 13px; background: none; border: none; padding: 4px 6px; margin: 0 -6px; border-radius: 3px; cursor: pointer; color: inherit; text-align: left; }
  .gleg-row:hover { background: var(--surface-2); }
  .gleg-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .gleg-row .dot { flex: none; width: 8px; height: 8px; border-radius: 3px; position: relative; top: -1px; }
  .gleg-row .gleg-role { color: var(--muted); font-size: 13px; }
  /* overview: one section per group — tag, name, note box, then its files as rows */
  .ovg { margin: 0 0 16px; }
  .ovg + .ovg { border-top: 1px solid var(--line); padding-top: 14px; }
  .ovg-name { display: block; width: 100%; text-align: left; background: none; border: none;
    padding: 2px 4px; margin: 0 -4px 8px; border-radius: 3px; font: inherit; font-weight: 500;
    font-size: 15px; color: inherit; cursor: pointer; }
  .ovg-name:hover { background: var(--surface-2); color: var(--accent); }
  .ovg-name:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .ovg-files { list-style: none; margin: 8px 0 0; padding: 0; }
  .ovg-file { display: flex; align-items: baseline; gap: 4px; margin: 0 -4px; }
  .ovg-fpath { display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 0; background: none; border: none; padding: 3px 4px; border-radius: 3px; cursor: pointer; font: inherit; color: inherit; text-align: left; }
  .ovg-fpath:hover { background: var(--surface-2); }
  .ovg-fpath:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .ovg-view { flex: none; align-self: center; font: inherit; font-size: 13px; line-height: 1;
    cursor: pointer; background: none; border: 1px solid var(--line); border-radius: 4px;
    padding: 2px 7px; color: var(--muted); opacity: 0; transition: opacity var(--t); }
  .ovg-file:hover .ovg-view, .ovg-view:focus-visible { opacity: 1; }
  .ovg-view:hover { border-color: var(--accent); color: var(--accent); }
  .ovg-view:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* aside sub-tabs: Overview | Call graph */
  .aside-subtabs { display: flex; gap: 4px; margin: 0 0 14px; }
  .aside-subtab { font: inherit; font-family: var(--mono); font-size: 13px; cursor: pointer; padding: 4px 10px;
    border-radius: 5px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); }
  .aside-subtab:hover { border-color: var(--accent); }
  .aside-subtab.on { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  .aside-subtab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* call graph: a dependency tree of the map's edges, guide chars kept monospace */
  .callgraph { font-family: var(--mono); font-size: 13px; }
  .cg-row { display: flex; align-items: baseline; gap: 2px; border-radius: 3px; }
  .cg-row:hover { background: var(--surface-2); }
  .cg-guide { white-space: pre; color: var(--muted); flex: none; }
  .cg-node { display: inline-flex; align-items: baseline; gap: 6px; min-width: 0; font: inherit; cursor: pointer;
    background: none; border: none; padding: 1px 3px; color: inherit; text-align: left; overflow-wrap: anywhere; }
  .cg-node:hover { color: var(--accent); }
  .cg-node:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .cg-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--sc, var(--muted)); align-self: center; }
  .cg-rep { color: var(--muted); }
  .cg-view { flex: none; margin-left: auto; align-self: center; font: inherit; font-size: 13px; cursor: pointer;
    background: none; border: 1px solid var(--line); border-radius: 5px; padding: 0 7px; color: var(--muted); opacity: 0;
    transition: opacity var(--t); }
  .cg-row:hover .cg-view, .cg-view:focus-visible { opacity: 1; }
  .cg-view:hover { border-color: var(--accent); color: var(--accent); }
  .ovg-ext { flex: none; min-width: 3.5ch; font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .ovg-path { flex: 1; min-width: 0; font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
  .ovg-stat { flex: none; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .linklike { background: none; border: none; padding: 0; font: inherit; font-size: inherit; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .linklike:hover { filter: brightness(1.15); }
  #helpBody { padding: 14px 18px 18px; font-size: 13.5px; }
  #helpBody p { margin: 0 0 12px; }

  .pane-hint { color: var(--muted); font-size: 13px; margin: -6px 0 14px; }

  /* story */
  .story { display: flex; flex-direction: column; }
  .step { border: 1.5px solid var(--sc, var(--line)); border-radius: 3px; background: color-mix(in srgb, var(--sb, var(--surface-2)) 45%, var(--surface)); padding: 12px 14px; }
  .step-label { font-family: var(--mono); font-size: 13px;  color: var(--sc); font-weight: 500; margin: 0 0 4px; }
  .step-text { font-size: 14px; margin: 0; }
  .branches { display: grid; gap: 6px; margin: 10px 0 0; }
  .branch { border-left: 3px solid var(--sc); border-radius: 0 3px 3px 0; background: var(--surface-2); padding: 5px 11px; font-size: 13px; }
  .branch b { font-family: var(--mono); font-size: 13px;  color: var(--sc); margin-right: 6px; }
  .step-files { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
  .fchip { font: inherit; font-family: var(--mono); font-size: 13px; cursor: pointer; border: 1px solid var(--line); border-radius: 3px; padding: 2.5px 10px; background: var(--surface); color: var(--ink); transition: border-color var(--t), transform var(--t); }
  .fchip:hover { border-color: var(--sc, var(--accent)); transform: translateY(-1px); }
  .fchip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .fchip .dot { display: inline-block; width: 7px; height: 7px; border-radius: 3px; margin-right: 6px; background: var(--sc, var(--accent)); }
  .link-row { display: flex; gap: 9px; align-items: baseline; color: var(--muted); font-size: 13px; font-style: italic; padding: 7px 4px 7px 18px; position: relative; }
  .link-row::before { content: ''; position: absolute; left: 24px; top: 0; bottom: 0; width: 2px; background: var(--line); }
  .link-row .la { font-style: normal; color: var(--accent); position: relative; z-index: 1; background: var(--surface); padding: 0 1px; margin-left: 1px; }

  /* diagrams */
  .diagram { border: 1px solid var(--line); border-radius: 3px; padding: 14px; margin: 0 0 16px; background: var(--surface); }
  .diagram h3 { margin: 0 0 2px; font-size: 15px; font-weight: 500; }
  .dg-head { display: flex; align-items: baseline; gap: 10px; }
  .dg-head h3 { flex: 1; min-width: 0; }
  .dg-actions { display: flex; gap: 6px; flex: none; }
  .dg-btn { width: 28px; height: 28px; border-radius: 3px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font-size: 14px; line-height: 1; cursor: pointer; transition: border-color var(--t), color var(--t); }
  .dg-btn:hover { border-color: var(--accent); color: var(--accent); }
  .dg-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .diagram .cap { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  /* Crosshair over the field says "drag to select a region"; a node overrides it
     with a pointer to say "click me". Together they make the diagram's two
     affordances legible without a word of instruction. */
  .diagram .mermaid-box { overflow-x: auto; background: var(--surface-2); border-radius: 3px; padding: 10px; position: relative; cursor: crosshair; }
  /* While dragging a region, suppress native text selection so the drag never turns
     into a text highlight (which used to hijack the gesture with an "ask about text" hint). */
  .diagram .mermaid-box.dg-dragging { user-select: none; -webkit-user-select: none; }
  /* Centre the diagram and let it use the row. mermaid caps the SVG at its natural
     width, so a small one sits left with the row empty; fitDiagrams() (JS) sets a
     width that grows it toward the row but caps the upscale so a tiny diagram doesn't
     balloon, and a wide one just fits. max-width/height here keep it uniform and
     bounded; !important beats mermaid's inline style. */
  .diagram .mermaid-box svg { display: block; margin: 0 auto; height: auto !important; max-width: 100% !important; }
  .mermaid-box svg .node, .mermaid-box svg .er.entityBox, .mermaid-box svg g[id^="entity-"] { cursor: pointer; }
  /* Single-diagram pop-out (#dg=<i>): hide the report chrome and every diagram but the
     focused one — a clean window that is still a full viewer (palette, and ask/note
     when served). */
  body.dg-focus .kicker, body.dg-focus #title, body.dg-focus .sub, body.dg-focus #statbar,
  body.dg-focus #scopebar, body.dg-focus #consistency, body.dg-focus .modebar,
  body.dg-focus #tabs, body.dg-focus #diagramsHint, body.dg-focus .footstrip { display: none !important; }
  body.dg-focus .wrap { max-width: none !important; padding: 12px 16px !important; }
  body.dg-focus .pane:not(#pane-diagrams) { display: none !important; }
  body.dg-focus #pane-diagrams .diagram { display: none; }
  body.dg-focus #pane-diagrams .diagram.dg-focused { display: block; margin: 0; }
  body.dg-focus .diagram.dg-focused [data-pop] { display: none; }
  /* Drag-select rectangle for asking about a region of a diagram. */
  .dg-select { position: absolute; z-index: 5; pointer-events: none; border: 1.5px dashed var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 2px; }
  /* A persisted region: the frame of a selection that carries a note or a
     discussion, redrawn from the journal on every render (mermaid re-lays-out the
     SVG, so pixel geometry is recomputed from the covered nodes each time). */
  .dg-region { position: absolute; z-index: 4; pointer-events: none; border: 1.5px dashed var(--line-strong); border-radius: 3px; }
  /* The badge(s) at an annotated node or region: a small square with a chat or a
     note glyph. Clickable — opens that place's thread. */
  .dg-badges { position: absolute; z-index: 6; display: inline-flex; gap: 3px; }
  .dg-badge { width: 20px; height: 20px; display: grid; place-items: center; padding: 0; cursor: pointer;
    border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--accent);
    transition: border-color var(--t), color var(--t); }
  /* The glyph is always the accent colour so an annotated place is visible at a glance;
     hovering the badge highlights its border. */
  .dg-badge:hover { border-color: var(--accent); }
  .dg-badge:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .dg-badge svg { width: 13px; height: 13px; }
  pre.mermaid { margin: 0; text-align: center; }
  /* No :hover restyle on diagram nodes. On an SVG <g>, ANY hover repaint (opacity,
     stroke, …) rides on a :hover state that drops and regains itself every frame,
     so the node visibly flickers/shifts. The pointer cursor is the affordance;
     the hover state carries no rendering, so there is nothing to flicker. */
  .diagram .step-files { margin-top: 10px; }

  /* map (files tab) */
  #map { position: relative; }
  #edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 2; }
  #edges path { fill: none; stroke: var(--ec, var(--muted)); stroke-width: 1.6; opacity: 0; transition: opacity var(--t), stroke-width var(--t); }
  #edges.all path { opacity: .3; }
  #edges path.on { opacity: 1; stroke-width: 2.6; }
  #edges .arrow { fill: var(--ec, var(--muted)); opacity: 0; transition: opacity var(--t); }
  #edges.all .arrow { opacity: .4; }
  #edges .arrow.on { opacity: 1; }
  /* Edge labels are HTML over the map, not SVG text: the TITLE rides the line as a
     one-line pill capped by CSS (no JS truncation), and hovering it opens a popover
     with the full DESCRIPTION (with a "more" toggle when it is long). Shown with the
     edge (on hover/select) or when "show all links" is on. */
  .elabels { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .elabel { position: absolute; transform: translate(-50%, -50%); opacity: 0; transition: opacity var(--t); }
  .elabel.on, .elabels.all .elabel { opacity: 1; pointer-events: auto; }
  /* thinned by declutter: hidden while "show all" is on, until its edge is hovered */
  .elabels.all .elabel.crowded:not(.on) { opacity: 0; pointer-events: none; }
  .elabel-t { display: block; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 5px; padding: 2px 8px; }
  .elabel:hover .elabel-t { border-color: var(--accent); }
  .elabel-pop { display: none; position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    width: max-content; max-width: 300px; background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: 5px; padding: 8px 10px; z-index: 6; }
  .elabel:hover .elabel-pop, .elabel-pop:hover { display: block; }
  .elabel-title { display: block; font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--ink); }
  .elabel-title:not(:only-child) { margin-bottom: 6px; }
  .elabel-desc { display: block; font-size: 13px; line-height: 1.5; color: var(--ink-2); }
  .elabel-pop:not(.expanded) .elabel-desc { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .elabel-more { display: block; margin-top: 6px; font: inherit; font-size: 13px; cursor: pointer;
    background: none; border: none; padding: 0; color: var(--accent); }
  .groups { display: flex; flex-direction: column; gap: 20px; position: relative; z-index: 1; }
  .group { border: 1.5px solid var(--gc, var(--line)); border-radius: 3px; background: color-mix(in srgb, var(--gbg, var(--surface-2)) 55%, var(--surface)); padding: 12px 14px 14px; }
  .group.collapsed { padding-bottom: 12px; }
  /* brief ring when the overview jumps the reading column to this group */
  .group.flash, .node.flash { animation: groupflash 1.2s ease-out; }
  @keyframes groupflash {
    0% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--gc) 60%, transparent); }
    100% { box-shadow: 0 0 0 3px transparent; } }
  .group.collapsed .nodes { display: none; }
  .group-row { display: flex; align-items: center; gap: 6px; margin: 0 0 10px; }
  .group.collapsed .group-row { margin-bottom: 0; }
  .fold { flex: none; width: 26px; height: 26px; border-radius: 3px; border: 1px solid transparent; background: none; cursor: pointer; color: var(--gc); font-size: 13px; display: grid; place-items: center; transition: transform var(--t), background var(--t); }
  .fold:hover { background: color-mix(in srgb, var(--gc) 14%, transparent); }
  .fold:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .group.collapsed .fold { transform: rotate(-90deg); }
  .group-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex: 1; min-width: 0; background: none; border: none; padding: 4px 6px; margin: -4px 0; border-radius: 3px; cursor: pointer; text-align: left; color: inherit; font: inherit; }
  .group-head:hover, .group-head:focus-visible { background: color-mix(in srgb, var(--gc) 12%, transparent); }
  .group-head:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .group-tag { font-family: var(--mono); font-size: 13px;  color: var(--gc); font-weight: 500; }
  .group-name { font-weight: 500; font-size: 14.5px; }
  .group-hint { color: var(--muted); font-size: 13px; margin-left: auto; font-variant-numeric: tabular-nums; }
  /* per-group "mark all read" — a quiet ✓ that fills in when the whole group is read */
  .gseen-btn { flex: none; width: 24px; height: 24px; border-radius: 4px; border: 1px solid var(--line);
    background: none; color: var(--muted); font-size: 13px; line-height: 1; cursor: pointer; opacity: 0;
    transition: opacity var(--t), border-color var(--t), color var(--t), background var(--t); }
  .group:hover .gseen-btn, .gseen-btn.on, .gseen-btn:focus-visible { opacity: 1; }
  .gseen-btn:hover { border-color: var(--accent); color: var(--accent); }
  .gseen-btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  .group.gdone .group-name, .group.gdone .group-tag { color: var(--ink-3); }
  .group.gdone { opacity: .72; }
  /* focus: read one group alone; the ⤢ button also exits */
  .gfocus-btn { flex: none; width: 24px; height: 24px; border-radius: 4px; border: 1px solid var(--line);
    background: none; color: var(--muted); font-size: 13px; line-height: 1; cursor: pointer; opacity: 0;
    transition: opacity var(--t), border-color var(--t), color var(--t), background var(--t); }
  .group:hover .gfocus-btn, .gfocus-btn.on, .gfocus-btn:focus-visible { opacity: 1; }
  .gfocus-btn:hover { border-color: var(--accent); color: var(--accent); }
  .gfocus-btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  .groups.focusing .group:not(.focused) { display: none; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--accent); cursor: pointer; }
  .files-hint { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; margin: 0 0 12px; }
  .nodes { display: flex; flex-wrap: wrap; gap: 10px; }
  /* File cards grow to fill the row instead of sitting at a fixed 320px: a row of two
     splits the width, and a card left alone on its row (a one-file group, or the last
     of an odd count) takes the whole width — so the code preview uses the space and
     reads better. min-width:0 lets the preview truncate instead of overflowing. */
  .groups .node { flex: 1 1 300px; max-width: none; min-width: 0; }
  .node { display: flex; flex-direction: column; gap: 3px; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 9px 12px 10px; cursor: pointer; font: inherit; color: inherit; text-align: left; max-width: 320px; transition: border-color var(--t), transform var(--t); }
  /* Scoped to .groups: a mermaid diagram node is ALSO `.node`, and a CSS transform
     on an SVG <g> overrides its positioning `transform` attribute — the node jumps
     (to origin, or by 1px) on hover and flickers. File cards live in .groups; the
     diagram's do not, so the lift only reaches the cards it was meant for. */
  .groups .node:hover { border-color: var(--gc); transform: translateY(-1px); }
  .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .node.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .node-top { display: flex; align-items: baseline; gap: 8px; }
  .node .fname { font-family: var(--mono); font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
  .node .fname .fdir { color: var(--muted); font-weight: 400; }
  .node .fstat { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; margin-left: auto; white-space: nowrap; }
  .a { color: var(--add); } .d { color: var(--del); }
  .node-meta { display: flex; align-items: center; gap: 8px; }
  .svc { font-family: var(--mono); font-size: 13px; font-weight: 500;  color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 7px; }
  .node .frole { font-size: 13px; color: var(--muted); }
  /* cross-group links as chips on the node — click jumps to the linked file */
  .node-links { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
  .nlink { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; font-family: var(--mono);
    font-size: 13px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 5px; padding: 1px 8px 1px 6px; cursor: pointer; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; transition: border-color var(--t), color var(--t); }
  .nlink:hover { border-color: var(--sc); color: var(--ink-2); }
  .nlink .dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--sc); }
  .fprev { margin-top: 5px; border-radius: 3px; background: var(--code-bg); border: 1px solid var(--line); padding: 4px 0; overflow: hidden; }
  .fprev .cl { font-size: 13px; line-height: 1.5; padding: 0 8px; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

  .manifest { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; }
  .manifest summary { cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); }
  .manifest summary:hover { color: var(--ink); }
  .manifest[open] summary { margin-bottom: 8px; }
  .mrow { display: flex; gap: 10px; align-items: baseline; width: 100%; font-family: var(--mono); font-size: 13px; padding: 3.5px 4px; background: none; border: none; cursor: pointer; color: inherit; text-align: left; border-radius: 3px; }
  .mrow:hover { background: var(--surface-2); }
  .mrow:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .mrow .dot { flex: none; width: 8px; height: 8px; border-radius: 3px; background: var(--mc, var(--line)); position: relative; top: -1px; }
  .mrow .mpath { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .mrow .mstat { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .mrow .mnew { color: var(--add); font-size: 13px; }

  /* standards */
  .finding { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 3px; padding: 12px 14px; margin: 0 0 10px; background: var(--surface); }
  .sev { flex: none; font-family: var(--mono); font-size: 13px; font-weight: 500;  border-radius: 3px; padding: 2px 10px; position: relative; top: 2px; }
  .sev.warn { background: var(--flag-bg); color: var(--flag); }
  .sev.info { background: var(--sunken); color: var(--ink-2); }
  .sev.ok { background: var(--accent-bg); color: var(--accent); }
  .finding .fbody { min-width: 0; font-size: 13.5px; }
  .finding .floc { margin-top: 4px; font-size: 13px; }
  .finding .fpattern { margin-top: 4px; font-size: 13px; color: var(--muted); }
  .loclink { font: inherit; font-family: var(--mono); font-size: 13px; font-weight: 500; background: none; border: none; padding: 0; cursor: pointer; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .loclink:hover { filter: brightness(1.15); }

  /* tests / ops / blast */
  .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  /* When one side is empty (e.g. no tests fixed), don't leave half the row blank —
     the populated list gets the full width, the empty one stays as its count line. */
  .cols2.one { grid-template-columns: 1fr; }
  @media (max-width: 760px) { .cols2 { grid-template-columns: 1fr; } }
  /* ── ask: present only when served by scripts/serve.mjs ────────────────────
     Everything here stays display:none until the page finds an injected token,
     so the assembled file and the published artifact show no dead controls. */
  .askable { position: relative; }
  .askbtn { position: absolute; top: 6px; right: 6px; z-index: 3; display: none; align-items: center; gap: 4px;
    font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 3px; padding: 1px 9px;
    border: 1px solid var(--line); background: var(--surface); color: var(--muted); opacity: 0; transition: opacity var(--t); }
  body.can-ask .askbtn { display: inline-flex; }
  .askable:hover > .askbtn, .askbtn:focus-visible, .askbtn.has { opacity: 1; }
  .askbtn:hover { border-color: var(--accent); color: var(--accent); }
  .askbtn.has { border-color: var(--accent); color: var(--accent); background: var(--surface-2); }
  .step.picked, .ustory.picked { outline: 2px solid var(--accent); outline-offset: 1px; }
  .asksel { position: absolute; z-index: 40; display: none; font: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; border-radius: 3px; padding: 4px 12px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-ink); }
  .askbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 45; display: none;
    align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--accent); border-radius: 3px;
    padding: 7px 8px 7px 16px; font-size: 13px; }
  .askbar.on { display: flex; }

  /* markers: a comment pin that stays put, the way a Notion comment does */
  .askmark { position: absolute; top: 6px; right: 6px; z-index: 4; display: none; align-items: center; justify-content: center;
    min-width: 20px; height: 20px; padding: 0 6px; font-family: var(--mono); font-size: 13px; font-weight: 500; cursor: pointer;
    border-radius: 3px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
  body.can-ask .askmark { display: inline-flex; }
  .askmark.dim { background: var(--surface); color: var(--accent); }
  .dg-actions .askmark { position: static; }
  .askmark:hover { filter: brightness(1.08); }
  /* a question asked on selected text keeps the text highlighted, with the pin inline */
  .askquote { background: var(--flag-bg); border-bottom: 1px solid var(--flag); }
  .askpin { display: inline-flex; align-items: center; justify-content: center; vertical-align: super;
    min-width: 15px; height: 15px; margin-left: 2px; padding: 0 4px; font-family: var(--mono); font-size: 13px; font-weight: 500;
    cursor: pointer; border-radius: 3px; border: none; background: var(--flag); color: var(--accent-ink); }

  /* Book bookmarks: positioned in DOCUMENT coordinates, so each one stays beside
     its own content and scrolls away with it. Pinning them to the viewport made
     them drift against the text they belong to, which read as broken. */
  .rail { position: absolute; left: 0; top: 0; width: 30px; z-index: 35; display: none; pointer-events: none; }
  body.can-ask .rail.on { display: block; }
  /* Reserve a margin for the bookmarks so they never sit on top of the text —
     on a narrow window the content column otherwise reaches the left edge. */
  body.has-marks .wrap { padding-left: 62px; }
  .rail .bm { position: absolute; left: 0; pointer-events: auto; display: flex; align-items: center; gap: 4px;
    height: 21px; padding: 0 7px 0 5px; font-family: var(--mono); font-size: 13px; font-weight: 500; cursor: pointer;
    border: 1px solid var(--line); border-left: none; border-radius: 0 3px 3px 0; background: var(--surface); color: var(--muted);
     transition: transform var(--t), background var(--t), color var(--t); white-space: nowrap; }
  .rail .bm:hover, .rail .bm.here { transform: translateX(3px); background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  /* questions living on another tab are counted on that tab's button instead */
  .tab .qcnt { display: inline-flex; align-items: center; justify-content: center; min-width: 15px; height: 15px;
    margin-left: 5px; padding: 0 4px; border-radius: 3px; background: var(--accent); color: var(--accent-ink);
    font-family: var(--mono); font-size: 13px; font-weight: 500; }

  /* chat: a full-height panel in the right column, sharing it with the inspector */
  .askpanel { display: none; flex-direction: column; position: sticky; top: 16px; max-height: calc(100vh - 32px);
    background: var(--surface); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .askpanel.on { display: flex; }
  .askpanel .dk-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
  .askpanel .dk-head b { font-size: 13px; font-weight: 500; }
  .askpanel .dk-head .grow { flex: 1; }
  .askpanel .dk-btn { font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: var(--surface);
    color: var(--muted); border-radius: 3px; padding: 2px 8px; }
  .askpanel .dk-btn:hover { border-color: var(--accent); color: var(--accent); }
  .askpanel .dk-x { font: inherit; font-size: 15px; line-height: 1; cursor: pointer; border: none; background: none; color: var(--muted); padding: 2px 4px; }
  .askpanel .dk-anchor { font-family: var(--mono); font-size: 13px; color: var(--muted); padding: 8px 12px 0; overflow-wrap: anywhere; }
  .askpanel .dk-quote { margin: 6px 12px 0; padding: 6px 10px; border-left: 2px solid var(--flag); background: var(--surface-2);
    font-size: 13px; color: var(--muted); max-height: 90px; overflow: auto; white-space: pre-wrap; }
  .askpanel .dk-threads { flex: 1; overflow-y: auto; padding: 10px 12px 0; min-height: 120px; }
  .askpanel .dk-t { border-top: 1px dashed var(--line); padding: 10px 0 2px; }
  .askpanel .dk-t:first-child { border-top: none; }
  .askpanel .dk-q { font-size: 13px; font-weight: 500; background: var(--surface-2); border-radius: 3px; padding: 7px 10px; }
  /* an instruction is a different speech act from a question, and a thread with
     both in it has to be scannable */
  .askpanel .dk-q .kq { font-family: var(--mono); font-size: 13px; font-weight: 400; color: var(--ink-3);
    border: 1px solid var(--line-strong); border-radius: 3px; padding: 0 4px; margin-right: 6px; }
  .askpanel .dk-a { font-size: 13.5px; margin-top: 7px; overflow-wrap: anywhere; }
  /* an error is not a deletion: it takes --flag, so it keeps its voice when the
     del side goes grey under the quiet diff palette */
  .askpanel .dk-err { color: var(--flag); font-size: 13px; margin-top: 6px; }
  .askpanel .dk-form { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .askpanel textarea { font: inherit; font-size: 13px; resize: vertical; min-height: 66px; max-height: 40vh; border-radius: 3px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); padding: 8px 10px; }
  .askpanel textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .askpanel .dk-row { display: flex; align-items: center; gap: 8px; }
  .askpanel .dk-hint { flex: 1; font-size: 13px; color: var(--muted); }

  /* ask vs instruct: one segmented control, because they are two things to say
     about the same place — not two panels */
  .askpanel .dk-mode { display: inline-flex; align-self: flex-start; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .askpanel .dk-mode button { font: inherit; font-size: 13px; cursor: pointer; border: none; background: var(--surface-2);
    color: var(--muted); padding: 3px 10px; }
  .askpanel .dk-mode button + button { border-left: 1px solid var(--line); }
  .askpanel .dk-mode button.on { background: var(--surface); color: var(--ink); font-weight: 500; box-shadow: inset 0 -2px 0 var(--accent); }
  /* a plan is structure the reviewer decides on, so it reads as fields, not prose */
  .dk-plan { margin-top: 8px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface-2); padding: 8px 10px; font-size: 13px; }
  .dk-plan dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; margin: 0; }
  .dk-plan dt { color: var(--ink-3); white-space: nowrap; }
  .dk-plan dd { margin: 0; overflow-wrap: anywhere; }
  .dk-plan .dk-ask { color: var(--flag); }
  .dk-acts { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .dk-note { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .dk-task { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; }
  /* a task's state, wherever it is shown: in a thread or on the Tasks tab */
  .st { font-family: var(--mono); font-size: 13px; border: 1px solid var(--accent); color: var(--accent);
    border-radius: 3px; padding: 1px 6px; white-space: nowrap; }
  .st.done, .st.verified { border-color: var(--add); color: var(--add); }
  .st.declined { border-color: var(--line-strong); color: var(--muted); }
  .st.proposed { border-color: var(--line-strong); color: var(--ink-2); }

  /* ── Tasks tab ──────────────────────────────────────────────────────────────
     A queue in the reading column: the state leads each card, the left rule
     carries whether it blocks, and nothing is boxed inside anything. */
  /* ── the report / review tabs ────────────────────────────────────────────────
     Report and Review are the two top-level TABS. They are real folder tabs that
     sit on the content card: the active one is outlined and JOINED to the card —
     its bottom edge breaks the card's top border (margin -1px + a matching-surface
     fill, lifted above the card with z-index) — so it is visible which view you are
     in and that the panel below is its content. The inactive tab is a plain label. */
  .modebar { display: inline-flex; gap: 4px; margin: 0 0 -1px; padding: 0 8px; align-items: stretch;
    position: relative; z-index: 1; }
  .modetab { font: inherit; font-size: 15px; font-weight: 500; cursor: pointer;
    border: 1px solid transparent; border-bottom: none; border-radius: 5px 5px 0 0; margin-bottom: -1px;
    background: none; color: var(--ink-3); padding: 8px 16px;
    display: inline-flex; align-items: center; gap: 7px; transition: color var(--t); }
  .modetab:hover { color: var(--ink); }
  .modetab.active { background: var(--surface); border-color: var(--line-strong); color: var(--ink); }
  .modetab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .modetab .cnt { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--flag);
    background: var(--flag-soft); border-radius: 3px; padding: 1px 7px; min-width: 8px; text-align: center; }
  .modetab .cnt:empty { display: none; }
  body.reviewing #tabs { display: none; }
  .tkhead-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 0 10px; }
  .tkhead-row h2 { margin: 0; font-size: 16px; font-weight: 500; flex: 1; }

  .tkgroup { margin: 0 0 18px; }
  .tkgroup h3 { margin: 0 0 6px; font-size: 13px; font-weight: 500; color: var(--ink-3); }
  .tkgroup h3 .cnt { font-family: var(--mono); font-size: 13px; color: var(--ink-3); font-weight: 500; }
  /* One line per item, so a queue reads as a queue: the state is a fixed-width token
     on the left, the text is one line (the whole of it is one click away in the
     thread), and the actions stay quiet until wanted. */
  .tkcard { border-left: 2px solid var(--line-strong); padding: 5px 0 5px 12px; margin: 0 0 3px; }
  .tkcard.open, .tkcard.in_progress { border-left-color: var(--flag); }
  .tkcard.declined, .tkcard.undecided { border-left-color: var(--line); }

  /* an option: its KIND leads, because that is what distinguishes it from the
     other two — not the wording of what it does */
  .dk-var { margin-top: 8px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface-2); padding: 8px 10px; font-size: 13px; }
  .dk-var .dk-vhead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
  .dk-var .vk { font-family: var(--mono); font-size: 13px; border: 1px solid var(--line-strong); color: var(--ink-3);
    border-radius: 3px; padding: 0 5px; white-space: nowrap; }
  .dk-var .vk.root { border-color: var(--flag); color: var(--flag); }
  .dk-var .vk.document { border-style: dashed; }
  .dk-var dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; margin: 0; }
  .dk-var dt { color: var(--ink-3); white-space: nowrap; }
  .dk-var dd { margin: 0; overflow-wrap: anywhere; }
  .dk-var .dk-acts { margin-top: 7px; }
  /* confirming what a task will say before it becomes one */
  .dk-tf { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
  .dk-tf .dk-tfl { font-size: 13px; color: var(--ink-3); }
  .dk-tf textarea { font: inherit; font-size: 13px; min-height: 52px; resize: vertical; border-radius: 3px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); padding: 6px 9px; }
  .dk-tf select, .dk-tf input { font: inherit; font-size: 13px; border-radius: 3px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); padding: 3px 8px; }
  .dk-tf input { flex: 1; min-width: 0; }
  .tkhead { display: flex; align-items: baseline; gap: 9px; }
  .tkhead .st { flex: none; min-width: 76px; text-align: center; }
  .tkhead b { font-size: 14px; font-weight: 400; flex: 1; min-width: 0; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tkcard.open .tkhead b, .tkcard.in_progress .tkhead b { font-weight: 500; }
  .tkcard:hover { background: var(--sunken); }
  .tkmeta { font-size: 13px; color: var(--muted); margin: 2px 0 0 85px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tkrow { display: flex; align-items: center; gap: 8px; margin: 3px 0 0 85px; opacity: 0; transition: opacity var(--t); }
  .tkcard:hover .tkrow, .tkcard:focus-within .tkrow, .tkcard.open .tkrow, .tkcard.in_progress .tkrow { opacity: 1; }
  .tkdone > summary { cursor: pointer; font-size: 13px; color: var(--ink-3); margin: 18px 0 8px; }
  .statline .vsep { color: var(--line-strong); }
  .tkpline b { font-weight: 500; }
  .tkrow .dk-btn { font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--line);
    background: var(--surface); color: var(--muted); border-radius: 3px; padding: 2px 8px; }
  .tkrow .dk-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .tkrow .dk-btn:disabled { opacity: .5; cursor: default; }
  .tkrow .tk-why { font: inherit; font-size: 13px; flex: 1; max-width: 34ch; border-radius: 3px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); padding: 2px 8px; }
  /* the patch a worked task produced: a change to read, not yet a change to the tree */
  .tkpatch { margin-top: 8px; }
  .tkpline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; }
  .tkpline .dk-btn { font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--line);
    background: var(--surface); color: var(--muted); border-radius: 3px; padding: 2px 8px; }
  .tkpline .dk-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tkfiles { margin-top: 8px; }
  .tkfile { margin: 0 0 10px; }
  .tkfhead { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
  .tkfhead .tkfn { font-family: var(--mono); color: var(--ink-3); }
  .tkwork { margin-top: 8px; }
  .tkwork .dk-a { font-size: 13.5px; }
  /* a remark whose place in the report is gone: kept, and labelled as kept */
  .stale { font-family: var(--mono); font-size: 13px; color: var(--muted);
    border: 1px dashed var(--line-strong); border-radius: 3px; padding: 0 5px; white-space: nowrap; }

  /* the model's own trace: live while it works, folded away once it answers */
  .trace { margin-top: 6px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .trace > summary { cursor: pointer; list-style: none; padding: 5px 10px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .trace > summary::-webkit-details-marker { display: none; }
  .trace .tr-body { padding: 2px 10px 8px; }
  .trace .tr-step { font-family: var(--mono); font-size: 13px; color: var(--muted); padding: 1.5px 0; overflow-wrap: anywhere; }
  .trace .tr-step::before { content: "› "; color: var(--accent); }
  .trace .tr-live { font-size: 13px; color: var(--muted); margin-top: 4px; white-space: pre-wrap; max-height: 120px; overflow: hidden; }

  /* markdown inside an answer */
  .md p { margin: 0 0 7px; } .md p:last-child { margin-bottom: 0; }
  .md ul, .md ol { margin: 0 0 7px; padding-left: 20px; }
  .md li { margin: 0 0 3px; }
  .md h1, .md h2, .md h3 { font-size: 13.5px; font-weight: 500; margin: 10px 0 5px; }
  .md code { font-family: var(--mono); font-size: 13px; background: var(--code-bg); border-radius: 3px; padding: .5px 4px; }
  .md pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; overflow-x: auto; margin: 0 0 8px; }
  .md pre code { background: none; padding: 0; font-size: 13px; line-height: 1.5; }
  .md blockquote { margin: 0 0 7px; padding-left: 10px; border-left: 2px solid var(--line); color: var(--muted); }
  .md strong { font-weight: 500; } .md em { font-style: italic; }

  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 3px; animation: sp .7s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* user stories: the status badge is the point, so it leads the card */
  .ustory { border: 1px solid var(--line); border-left-width: 2px; border-radius: 0; padding: 11px 14px; margin: 0 0 10px; background: var(--surface); }
  .ustory .uhead { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin: 0 0 5px; }
  .ust { flex: none; font-family: var(--mono); font-size: 13px; font-weight: 500;  border-radius: 3px; padding: 2px 10px; position: relative; cursor: help; }
  /* Instant custom tooltip — native title lags too long to be useful. */
  .utip { display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; width: max-content; max-width: 280px;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 5px;
    padding: 7px 10px; font-family: var(--sans); font-weight: 400; font-size: 13px; line-height: 1.5; color: var(--ink-2);
    text-decoration: none; white-space: normal; }
  .ust:hover .utip, .ust:focus-visible .utip { display: block; }
  .uactor { font-size: 13px; font-weight: 500; color: var(--muted); }
  .ucov { font-family: var(--mono); font-size: 13px; border-radius: 3px; padding: 1.5px 8px; border: 1px dashed var(--line); color: var(--muted); }
  .ucov.no { border-style: solid; border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); color: var(--warn); }
  .ustory .utext { font-size: 14px; font-weight: 500; }
  .ustory .uwhy { font-size: 13px; color: var(--muted); margin-top: 4px; }
  /* Traffic-light: delivered is good (green), partial is a caution (amber), broken
     is a problem (red), regressed is the worst — red and filled, so it reads as more
     than "broken". The left rule of the card carries the same colour. */
  .ustory.delivered { border-left-color: var(--pass); } .ust.delivered { color: var(--pass); }
  .ustory.partial   { border-left-color: var(--caution); } .ust.partial { color: var(--caution); }
  .ustory.broken    { border-left-color: var(--flag); } .ust.broken { color: var(--flag); }
  .ustory.regressed { border-left-color: var(--flag); }
  .ust.regressed { color: var(--flag); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 2px; }

  .listcard { border: 1px solid var(--line); border-radius: 3px; padding: 12px 14px; background: var(--surface); }
  .listcard h3 { margin: 0 0 8px; font-size: 14px; font-weight: 500; }
  .listcard h3 .cnt { font-family: var(--mono); font-size: 13px; color: var(--muted); font-weight: 500; }
  .listcard ul { margin: 0; padding: 0 0 0 18px; font-size: 13px; }
  .listcard li { margin: 0 0 6px; }
  .listcard.good { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .listcard.bad { border-color: color-mix(in srgb, var(--flag) 50%, var(--line)); }
  .empty-good { border: 1px solid var(--line); background: var(--accent-bg); color: var(--accent); border-radius: var(--r-panel); padding: 10px 14px; font-size: 13px; margin: 0 0 12px; }
  /* an optional pass that has not been run: what it is, and a button that runs it */
  .lazy { max-width: 62ch; padding: 8px 0; }
  .lazy-title { font-size: 15px; font-weight: 500; color: var(--ink); margin: 0 0 6px; }
  .lazy-what { color: var(--ink-2); font-size: 14px; line-height: 1.55; margin: 0 0 14px; }
  .lazy-gen { font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--accent-ink);
    background: var(--accent); border: 1px solid var(--accent); border-radius: 5px; padding: 7px 16px;
    transition: filter var(--t); }
  .lazy-gen:hover { filter: brightness(1.08); }
  .lazy-gen:disabled { cursor: default; opacity: .7; }
  .lazy-gen:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .lazy-steps { font-family: var(--mono); font-size: 13px; color: var(--ink-3); margin-top: 10px; }
  .lazy-err { color: var(--flag); font-size: 13px; margin-top: 10px; }
  /* Live progress while a lazy section or a diagram is (re)generated. One open-ended
     agent does the work, so the fill is an APPROXIMATE estimate (elapsed time + the
     read→write transition, set in JS), not an exact %. A determinate bar that actually
     advances — plus the current step and elapsed seconds. */
  .genprog { margin-top: 10px; }
  .genbar { height: 4px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .genbar > span { display: block; height: 100%; width: 2%; border-radius: 3px; background: var(--accent);
    transition: width .2s linear; }
  .genline { display: flex; justify-content: space-between; gap: 12px; margin-top: 7px;
    font-family: var(--mono); font-size: 13px; color: var(--ink-3); }
  .genstep { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gentime { flex: none; font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .genbar > span { transition: none } }
  /* Fallback shown in place of an unrenderable diagram (invalid generated source). */
  .mermaid-box.broken { cursor: default; }
  .dg-broken { max-width: 62ch; padding: 8px 0; }
  .dg-broken-msg { color: var(--ink-2); font-size: 14px; margin: 0 0 10px; }
  .dg-broken-src { margin: 0 0 12px; }
  .dg-broken-src summary { color: var(--muted); font-size: 13px; cursor: pointer; }
  .dg-broken-src pre { font-family: var(--mono); font-size: 13px; color: var(--ink-3); overflow-x: auto; margin: 8px 0 0; white-space: pre-wrap; }
  .dg-broken-acts { display: flex; gap: 10px; align-items: center; }
  .dg-broken-copy { font: inherit; font-size: 13px; cursor: pointer; color: var(--ink-2); background: none; border: 1px solid var(--line); border-radius: 5px; padding: 6px 12px; transition: border-color var(--t), color var(--t); }
  .dg-broken-copy:hover { border-color: var(--accent); color: var(--accent); }
  .dg-broken-steps { font-family: var(--mono); font-size: 13px; color: var(--ink-3); margin-top: 10px; }
  .dg-broken-err { color: var(--flag); font-size: 13px; margin-top: 10px; }
  .lazy-inline { padding: 0; }
  .lazy-inline .lazy-what { margin: 0 0 10px; font-size: 13px; }
  .brow { border: 1px solid var(--line); border-radius: 3px; padding: 10px 14px; margin: 0 0 10px; background: var(--surface); font-size: 13px; }
  .brow .bpath { font-family: var(--mono); font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
  .brow .bwhy { margin-top: 3px; color: var(--muted); }
  .section-note { background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 10px 14px; margin: 0 0 14px; font-size: 13.5px; }
  /* overview note collapses to a single line; the toggle appears only when it clips */
  .ovg-note.clamped { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .ovg-note-more { display: none; margin: -10px 0 14px; font: inherit; font-size: 13px; cursor: pointer;
    background: none; border: none; padding: 0; color: var(--accent); }
  .ovg-note-more.show { display: block; }
  #blastTitle { font-size: 15px; margin: 18px 0 4px; }

  /* inspector */

     the quiet palette --del-bg is transparent, so a removed node keeps only its
     dashed outline, which is the diagram's version of the grey strike.

     `#mermaid-<id>`, and an ID selector outranks any class selector we write. */

     puts behind the label — which would leave an opaque plate inside a removed
     node's transparent outline. The shape always carries .label-container; the

  .mermaid g.node.removed > polygon, .mermaid g.node.removed > circle {

  .mermaid g.node.removed tspan { color: var(--del-ink) !important; fill: var(--del-ink) !important; }

// ── group palette: color assigned by group ordinal ──────────────────────────
const groupIndex = {}
RM.groups.forEach((g, i) => { groupIndex[g.id] = (i % 8) + 1 })
const gcolor = (gid) => `var(--p${groupIndex[gid] || 7})`
const gbg = (gid) => `var(--p${groupIndex[gid] || 7}b)`
const fileGroup = {}
for (const g of RM.groups) for (const p of g.files) fileGroup[p] = g.id
// A large map behaves differently: all links shown at once would bury the cards, so
// links default to hover-only, groups open collapsed, and crowded labels are thinned.
const FILE_COUNT = Object.keys(RM.files).length
const BIG_MAP = FILE_COUNT > 24 || RM.groups.length > 6 || (RM.edges || []).length > 18
// On a big map, a link that leaves the group is a chip on the node (click = jump),
// not a line across the whole canvas — only same-group links stay drawn as lines.
const crossLinks = {}
if (BIG_MAP) {
  const seenKey = {}
  const add = (path, dir, other, title) => {
    const k = path + dir + other
    if (seenKey[k]) return; seenKey[k] = 1
    ;(crossLinks[path] ||= []).push({ dir, other, title })
  }
  for (const [from, to, title] of (RM.edges || [])) {
    if (fileGroup[from] === fileGroup[to]) continue
    add(from, '→', to, title); add(to, '←', from, title)
  }
}
const baseName = (p) => p.split('/').pop()

// §12: inline code passes through exactly ONE escape path. Everything is
// escaped, then the small inline set the generator is allowed to emit is put
// back. A field authored as plain text and one authored with <code> both land
// here, and neither can inject markup.
// Passes generate inline code two ways — <code> tags and markdown backticks —
// so both are normalised here rather than each render site guessing.
const PROSE_TAGS = /&lt;(\/?)(code|b|i|em|strong)&gt;/g
const prose = (v) => esc(v == null ? '' : v)
  .replace(PROSE_TAGS, '<$1$2>')
  .replace(/`([^`\n]+)`/g, '<code>$1</code>')
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
const shortName = (p) => { const parts = p.split('/'); return parts.length > 2 ? '…/' + parts.slice(-2).join('/') : p }
// Basename carries the identity, so show it in full weight and grey the directory —
// two nodes named …/Module.ts stop looking identical at a glance.
const fnameHTML = (p) => {
  const parts = p.split('/'); const base = parts.pop(); const parent = parts.pop()
  const dir = parent ? (parts.length ? '…/' : '') + parent + '/' : ''
  return `<span class="fdir">${esc(dir)}</span><span class="fbase">${esc(base)}</span>`
}
const chip = (path) => `<button class="fchip" data-goto="${esc(path)}" style="--sc:${gcolor(fileGroup[path])}">${fileIconSVG(path)}${esc(shortName(path))}</button>`

const statEl = document.getElementById('statbar')

statEl.innerHTML = [
  [totalFiles, L.statFiles(st.filesChanged || 0, st.filesNew || 0)],

].map(([v, l, hot]) => `<span class="${hot ? 'hot' : ''}"><b>${v}</b> ${esc(l)}</span>`).join('')

function langOf(path) {
  const base = path.split('/').pop().toLowerCase()
  if (base === 'dockerfile') return 'dockerfile'

}

let diagramsRendered = false

// mermaid's own themes ship their own palette and their own font stack — grey
// boxes, black labels, Trebuchet. Feeding 'base' the page's tokens is what keeps
// a diagram inside the design system instead of beside it. themeVariables are
// baked at render, so a palette switch has to re-render (see rerenderDiagrams).
// The UMD bundle auto-runs on DOMContentLoaded unless startOnLoad is turned off
// before that fires. An auto-run would compile every diagram with mermaid's own
// theme AND stamp data-processed on the node, so the themed render below would
// silently be skipped — which is exactly how this went wrong once. Suppress it
// first, and keep each source on its element: mermaid consumes the node it
// renders into, so a re-render needs the original text back.
if (window.mermaid) {
  mermaid.initialize({ startOnLoad: false })
  for (const n of document.querySelectorAll('#pane-diagrams pre.mermaid')) n.dataset.src = n.textContent
}
const token = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim()
const mermaidTheme = () => ({
  startOnLoad: false,
  theme: 'base',
  // Measured: on mermaid 11.16 themeVariables.fontFamily already drives both the
  // injected CSS and the label measurement, so this pair is redundant today. It
  // stays because fontFamily is the documented top-level knob and a version that
  // reads it there would otherwise lay the diagram out in Trebuchet. Note for
  // whoever prunes it: design.mjs does NOT cover this — the font assertion still
  // passes on themeVariables alone.
  fontFamily: token('--ui'), fontSize: 14,
  themeVariables: {
    fontFamily: token('--ui'), fontSize: '14px',
    background: token('--canvas'),
    primaryColor: token('--sunken'), primaryBorderColor: token('--line-strong'),
    primaryTextColor: token('--ink'), secondaryColor: token('--sunken'),
    tertiaryColor: token('--canvas'), tertiaryBorderColor: token('--line'),
    lineColor: token('--ink-3'), textColor: token('--ink'),
    nodeBorder: token('--line-strong'), mainBkg: token('--sunken'),
    clusterBkg: token('--canvas'), clusterBorder: token('--line'),
    edgeLabelBackground: token('--panel'), labelBoxBkgColor: token('--sunken'),
    labelBoxBorderColor: token('--line'), labelTextColor: token('--ink'),
    actorBkg: token('--sunken'), actorBorder: token('--line-strong'),
    actorTextColor: token('--ink'), signalColor: token('--ink-2'),
    signalTextColor: token('--ink'), sequenceNumberColor: token('--panel'),
    attributeBackgroundColorOdd: token('--panel'),
    attributeBackgroundColorEven: token('--sunken'),
  },
  // 'loose' is required for `click <id> call whydiffOpen(...)` directives;
  // the page is self-contained and its mermaid source is our own generator output.
  securityLevel: 'loose',
})
// Themed at render, never at load: the palette is only known once applyPalette
// has run, and it can change again afterwards. mermaid consumes the source node
// it renders into, so the original text is kept on the element and put back
// before a re-run — that is the only way to re-theme an existing diagram.
async function runDiagrams() {
  if (!window.mermaid) return
  const pres = [...document.querySelectorAll('#pane-diagrams pre.mermaid')]
  if (!pres.length) return
  mermaid.initialize(mermaidTheme())
  // Render each diagram on its own so a bad one (the generator can emit bad mermaid)
  // can't take the others down, and never shows mermaid's "Syntax error" bomb: we
  // validate (parse), then run just this diagram, catching BOTH ways it can fail — an
  // exception, or the bomb graphic injected in place (parse can pass where render
  // fails). Any failure becomes the readable fallback instead.
  for (const n of pres) {
    const src = n.dataset.src ?? n.textContent
    n.dataset.src = src
    const box = n.closest('.mermaid-box')
    let ok = true
    try { ok = await mermaid.parse(src, { suppressErrors: true }) } catch { ok = false }
    if (!ok) { if (box) renderBrokenDiagram(box, src); continue }
    n.textContent = src
    n.removeAttribute('data-processed')
    try {
      await mermaid.run({ nodes: [n] })
      const svg = box?.querySelector('svg')
      const bombed = svg && (svg.querySelector('.error-icon, .error-text') || /mermaid version/i.test(svg.textContent || ''))
      if (bombed) { if (box) renderBrokenDiagram(box, src) }
      else box?.classList.remove('broken')
    } catch {
      if (box) renderBrokenDiagram(box, src)
    }
  }
  fitDiagrams()
}

// Grow each diagram toward the width of its row so it reads more comfortably, but cap
// the upscale (×1.6) so a tiny diagram doesn't balloon; a diagram wider than the row
// just fits to it. Re-run after a resize, and redraw the annotation marks because the
// SVG changed size (badges are placed from live rects).
const DIAGRAM_MAX_SCALE = 1.6
function fitDiagrams() {
  const pane = document.getElementById('pane-diagrams')
  if (!pane) return
  for (const box of pane.querySelectorAll('.mermaid-box')) {
    const svg = box.querySelector('svg')
    if (!svg) continue
    const natural = svg.viewBox?.baseVal?.width || 0
    const avail = box.clientWidth - 20 // minus the box padding
    if (!natural || avail <= 0) { svg.style.width = ''; continue }
    svg.style.width = Math.round(Math.min(avail, natural * DIAGRAM_MAX_SCALE)) + 'px'
  }
  requestAnimationFrame(() => { try { drawDiagramMarks() } catch {} })
}
let fitRAF = 0
window.addEventListener('resize', () => { cancelAnimationFrame(fitRAF); fitRAF = requestAnimationFrame(fitDiagrams) })

// ── story ────────────────────────────────────────────────────────────────────

  step.innerHTML = `<p class="step-label">${esc(item.label)}</p><p class="step-text">${prose(item.text)}</p>${branches}
