// ── lazy sections: generate on demand ────────────────────────────────────────
// An optional pass that was not run shows what it is and a button that runs its
// agent against this same diff and folds the result into the report in place.
// A function declaration (not a const): lazyPane() is called from the story block
// above, which runs before this line, so it must be hoisted past the TDZ.
function canGenerate() { return !!(window.__WHYDIFF_SERVE__ && window.__WHYDIFF_SERVE__.token) }
function lazyPane(section) {
  const m = L.lazy[section]
  return `<div class="lazy">
    <div class="lazy-title">${esc(m.title)}</div>
    <p class="lazy-what">${esc(m.what)}</p>
    ${canGenerate()
      ? `<button class="lazy-gen" data-section="${section}">${esc(L.generate)}</button>
         <div class="lazy-steps" hidden></div><div class="lazy-err" hidden></div>`
      : `<p class="lazy-static">${esc(L.generateStatic)}</p>`}
  </div>`
}
// A live progress view for a generate / regenerate stream: an APPROXIMATE progress bar,
// the current step, and elapsed seconds. The pass is one open-ended agent, so there is no
// exact percentage — but two real signals make a fair estimate: elapsed time, and the
// moment the agent stops reading files and starts writing its answer (the server sends a
// `writing` phase then). The bar eases toward a cap while reading, then toward ~97% once
// writing, and the caller completes it by reloading on `done`. It never fabricates 100%.
// Returns { step, writing, done, stop }; function declaration so generate()/
// regenerateDiagrams() below (which call it) are hoisted past the TDZ.
function startGenProgress(el) {
  if (!el) return { step() {}, writing() {}, done() {}, stop() {} }
  el.hidden = false
  el.innerHTML = '<div class="genprog"><div class="genbar"><span></span></div>'
    + '<div class="genline"><span class="genstep"></span><span class="gentime">0s</span></div></div>'
  const barEl = el.querySelector('.genbar > span'), stepEl = el.querySelector('.genstep'), timeEl = el.querySelector('.gentime')
  const t0 = Date.now()
  let phase = 'reading', writeAt = 0, p = 0.04, ended = false
  const tick = () => {
    const now = Date.now(), elapsed = (now - t0) / 1000
    timeEl.textContent = `${Math.round(elapsed)}s`
    // genProgressEstimate (viewer-logic) is the pure model; keep it monotonic here.
    p = Math.max(p, genProgressEstimate({ elapsedS: elapsed, phase, writeElapsedS: (now - writeAt) / 1000, ended }))
    barEl.style.width = (Math.min(p, ended ? 1 : 0.985) * 100).toFixed(1) + '%'
  }
  const timer = setInterval(tick, 200); tick()
  return {
    step(text) { if (text) stepEl.textContent = text },
    writing() { if (phase === 'reading') { phase = 'writing'; writeAt = Date.now() } },
    done() { ended = true; tick() },
    stop() { clearInterval(timer); el.innerHTML = ''; el.hidden = true },
  }
}
async function generate(section, btn) {
  const wrap = btn.closest('.lazy')
  const stepsEl = wrap?.querySelector('.lazy-steps'), errEl = wrap?.querySelector('.lazy-err')
  btn.disabled = true; btn.textContent = L.generating
  if (errEl) { errEl.hidden = true; errEl.textContent = '' }
  const prog = startGenProgress(stepsEl)
  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-whydiff-token': window.__WHYDIFF_SERVE__.token },
      body: JSON.stringify({ section }),
    })
    if (res.headers.get('content-type')?.includes('application/json')) {
      const j = await res.json(); throw new Error(j.error || `HTTP ${res.status}`)
    }
    const reader = res.body.getReader(), dec = new TextDecoder()
    let buf = ''
    for (;;) {
      const { value, done } = await reader.read()
      if (done) break
      buf += dec.decode(value, { stream: true })
      const lines = buf.split('\n'); buf = lines.pop()
      for (const ln of lines) {
        if (!ln.trim()) continue
        let ev; try { ev = JSON.parse(ln) } catch { continue }
        if (ev.kind === 'step') prog.step(ev.text)
        else if (ev.kind === 'phase' && ev.phase === 'writing') prog.writing()
        else if (ev.kind === 'error') throw new Error(ev.error)
        else if (ev.kind === 'done') { prog.done(); SESSION.set('flashTab', section); return location.reload() }
      }
    }
    prog.done(); SESSION.set('flashTab', section); location.reload()
  } catch (e) {
    btn.disabled = false; btn.textContent = L.generate
    prog.stop()
    if (errEl) { errEl.hidden = false; errEl.textContent = `${L.generateFailed}: ${e.message}` }
  }
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('.lazy-gen')
  if (b && b.dataset.section) generate(b.dataset.section, b)
})

function renderBrokenDiagram(box, src) {

    </div>

}
async function regenerateDiagrams(btn) {

  if (errEl) { errEl.hidden = true; errEl.textContent = '' }

      body: JSON.stringify({ section: 'diagrams' }),
    })
    if (res.headers.get('content-type')?.includes('application/json')) { const j = await res.json(); throw new Error(j.error || `HTTP ${res.status}`) }
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = ''
    for (;;) {
      const { value, done } = await reader.read(); if (done) break
      buf += dec.decode(value, { stream: true })
      const lines = buf.split('\n'); buf = lines.pop()
      for (const ln of lines) {
        if (!ln.trim()) continue
        let ev; try { ev = JSON.parse(ln) } catch { continue }
        if (ev.kind === 'step') prog.step(ev.text)
        else if (ev.kind === 'phase' && ev.phase === 'writing') prog.writing()
        else if (ev.kind === 'error') throw new Error(ev.error)
        else if (ev.kind === 'done') { prog.done(); SESSION.set('flashTab', 'diagrams'); return location.reload() }
      }
    }
    prog.done(); SESSION.set('flashTab', 'diagrams'); location.reload()
  } catch (e) {
    btn.disabled = false; btn.textContent = L.dgBrokenRegen
    prog.stop()
    if (errEl) { errEl.hidden = false; errEl.textContent = `${L.generateFailed}: ${e.message}` }

document.addEventListener('click', (e) => {
  const copyBtn = e.target.closest('.dg-broken-copy')

    navigator.clipboard?.writeText(src)
    const was = copyBtn.textContent; copyBtn.textContent = L.copied
    setTimeout(() => { copyBtn.textContent = was }, 1200)

// ── standards ────────────────────────────────────────────────────────────────

  // Anchors carry the ORIGINAL index, so a question stays attached to its story

  const stories = (us.stories || []).map((s, i) => ({ ...s, __i: i }))

// ── tests ────────────────────────────────────────────────────────────────────
if (isGen('tests')) {

  document.getElementById('testsFixed').innerHTML = (RM.tests?.fixed || []).map(x => `<li>${prose(x)}</li>`).join('')

  document.getElementById('testsGaps').innerHTML = (RM.tests?.gaps || []).map((x, i) =>

// Syntax highlighting via the inlined highlight.js. Language comes from the file
// extension (we know it), so no auto-detect. hl() returns safe HTML (hljs escapes the
// text) with hljs-* spans the theme colours from palette tokens; it falls back to
// plain escaped text if the bundle is absent, the language is unknown, or a line
// won't parse — so a self-contained file with no hljs still reads, just uncoloured.
const HLJS_LANG = {
  ts: 'typescript', tsx: 'typescript', mts: 'typescript', cts: 'typescript',
  js: 'javascript', jsx: 'javascript', mjs: 'javascript', cjs: 'javascript',
  php: 'php', py: 'python', rb: 'ruby', go: 'go', rs: 'rust', java: 'java',
  kt: 'kotlin', swift: 'swift', c: 'c', h: 'c', cpp: 'cpp', cc: 'cpp', hpp: 'cpp',
  cs: 'csharp', sql: 'sql', css: 'css', scss: 'scss', less: 'less',
  html: 'xml', xml: 'xml', vue: 'xml', svelte: 'xml', json: 'json',
  yml: 'yaml', yaml: 'yaml', toml: 'ini', ini: 'ini', sh: 'bash', bash: 'bash',
  zsh: 'bash', md: 'markdown', markdown: 'markdown', dockerfile: 'dockerfile',
}
function hlLang(path) {
  if (/(^|\/)dockerfile$/i.test(String(path || ''))) return 'dockerfile'
  const ext = String(path || '').split('.').pop().toLowerCase()
  return HLJS_LANG[ext] || null
}
function hl(text, lang) {
  const s = text == null ? '' : String(text)
  if (!window.hljs || !lang) return esc(s)
  try { return hljs.highlight(s, { language: lang, ignoreIllegals: true }).value } catch { return esc(s) }
}

function previewHTML(f, path) {

}

// Edge anchor: the node itself, or the group header when the group is collapsed.
function anchorEl(path) {
  const gid = fileGroup[path]
  return groupEls[gid]?.classList.contains('collapsed') ? headEls[gid] : nodeEls[path]
}
function drawEdges() {
  const map = document.getElementById('map')
  const mapBox = map.getBoundingClientRect()
  svg.innerHTML = ''
  let labels = document.getElementById('elabels')
  if (!labels) { labels = document.createElement('div'); labels.id = 'elabels'; labels.className = 'elabels'; map.appendChild(labels) }
  labels.innerHTML = ''
  labels.classList.toggle('all', svg.classList.contains('all'))
  const collapsed = (p) => groupEls[fileGroup[p]]?.classList.contains('collapsed')
  for (const [from, to, title, description] of RM.edges) {
    // On a big map, cross-group links are chips on the node, not lines — drawing them
    // here is exactly the cross-canvas spaghetti we removed.
    if (BIG_MAP && fileGroup[from] !== fileGroup[to]) continue
    // Both ends folded away: the label would land on a group header and mean nothing
    // until you open the group. Skip it — the edge returns when either side expands.
    if (collapsed(from) && collapsed(to)) continue
    const fromEl = anchorEl(from), toEl = anchorEl(to)
    if (!fromEl || !toEl || fromEl === toEl) continue
    const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect()
    const down = a.top < b.top
    const x1 = a.left + Math.min(a.width * .5, 130) - mapBox.left
    const y1 = (down ? a.bottom : a.top) - mapBox.top
    const x2 = b.left + Math.min(b.width * .5, 130) - mapBox.left
    const y2 = (down ? b.top : b.bottom) - mapBox.top
    const my = (y1 + y2) / 2
    const color = gcolor(fileGroup[from])
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path')
    p.setAttribute('d', `M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2 + (down ? -5 : 5)}`)
    p.style.setProperty('--ec', color); p.dataset.from = from; p.dataset.to = to
    svg.appendChild(p)
    const dir = down ? 1 : -1
    const ar = document.createElementNS('http://www.w3.org/2000/svg', 'path')
    ar.setAttribute('d', `M ${x2 - 4.5} ${y2 - 6 * dir} L ${x2} ${y2} L ${x2 + 4.5} ${y2 - 6 * dir} Z`)
    ar.setAttribute('class', 'arrow')
    ar.style.setProperty('--ec', color); ar.dataset.from = from; ar.dataset.to = to
    svg.appendChild(ar)
    // The title rides the line as a one-line pill, capped by CSS to a short width.
    // Hovering it opens a popover with the FULL title (the pill ellipsised it) and
    // the description — so nothing on the line is unreadable. Both live in an HTML
    // layer over the map, so the width-limit, ellipsis and popover are plain CSS.
    if (title) {
      const lab = document.createElement('div')
      lab.className = 'elabel'; lab.dataset.from = from; lab.dataset.to = to
      lab.style.left = ((x1 + x2) / 2) + 'px'; lab.style.top = my + 'px'
      const long = !!description && description.length > 150
      lab.innerHTML = `<span class="elabel-t">${esc(title)}</span>`
        + `<span class="elabel-pop"><b class="elabel-title">${esc(title)}</b>`
        + (description ? `<span class="elabel-desc">${esc(description)}</span>${long ? `<button type="button" class="elabel-more">${esc(L.edgeMore)}</button>` : ''}` : '')
        + `</span>`
      labels.appendChild(lab)
    }
  }
  refreshEdges()
  if (allEdges.checked) requestAnimationFrame(declutterLabels)
}
// An edge is visible when its file is hovered or selected; the checkbox shows all.
function refreshEdges() {
  const mark = (el) => {
    const touches = (id) => id && (el.dataset.from === id || el.dataset.to === id)
    el.classList.toggle('on', touches(hoverId) || touches(activeId))
  }
  for (const p of svg.children) mark(p)
  const labels = document.getElementById('elabels')
  if (labels) for (const l of labels.children) mark(l)
}
// With every label shown, dense maps stack pills on top of each other. Greedily keep
// the first label in each spot and mark the rest "crowded" — CSS hides those until
// their edge is hovered/selected (.on wins), so nothing is lost, just thinned.
function declutterLabels() {
  const labels = document.getElementById('elabels')
  if (!labels || !allEdges.checked) return
  const kept = []
  for (const el of labels.children) {
    el.classList.remove('crowded')
    const r = el.getBoundingClientRect()
    if (!r.width) continue
    const hit = kept.some(k => r.left < k.right && r.right > k.left && r.top < k.bottom && r.bottom > k.top)
    if (hit) el.classList.add('crowded'); else kept.push(r)
  }
}

const legendHTML = () => `<ul class="glegend">${RM.groups.map(g => `
  <li><button class="gleg-row" data-group="${esc(g.id)}"><span class="dot" style="background:${gcolor(g.id)}"></span><b>${esc(g.name)}</b><span class="gleg-role">${esc(L.roles[g.role] || g.role)}</span></button></li>`).join('')}</ul>`
// The default inspector walks every group: its tag + name, the one-line reason in a
// note box, then its files as rows (type label · path · +/- counts). Each row is a
// [data-goto] into the file, so the overview doubles as an index.
const overviewGroupsHTML = () => RM.groups.map(g => `

    <p class="insp-tag" style="color:${gcolor(g.id)}">${esc(g.tag || g.role)}</p>

    <ul class="ovg-files">${g.files.map(p => {

      if (!f) return ''
      return `<li class="ovg-file"><button class="ovg-fpath" data-gofile="${esc(p)}" title="${esc(L.jumpToFile)}">${fileIconSVG(p)}<span class="ovg-path">${esc(p)}</span><span class="ovg-stat"><span class="a">+${f.add}</span> <span class="d">−${f.del}</span></span></button><button class="ovg-view" data-goto="${esc(p)}" title="${esc(L.viewChangeTitle)}">${esc(L.viewChange)}</button></li>`
    }).join('')}</ul>
  </section>`).join('')

// The aside index has two views: the per-group Overview, and a Call graph — the
// map's file connections (edges) laid out as a dependency tree. A node jumps the
// reading column to its Code-map block; its `view` opens the drill-down.
let asideIndexView = 'overview'
function callGraphHTML() {
  const edges = RM.edges || []
  if (!edges.length) return `<p class="note">${esc(L.callGraphEmpty)}</p>`
  const kids = {}, indeg = {}, nodes = new Set()
  for (const [f, t] of edges) {
    ;(kids[f] ||= []).push(t)
    indeg[t] = (indeg[t] || 0) + 1
    indeg[f] = indeg[f] || 0
    nodes.add(f); nodes.add(t)
  }
  let roots = [...nodes].filter(n => !indeg[n])
  if (!roots.length) roots = [...nodes].slice(0, 1) // all cyclic: start anywhere
  const seen = new Set(), rows = []
  const walk = (node, prefix, isLast, isRoot) => {
    const guide = isRoot ? '' : prefix + (isLast ? '└── ' : '├── ')
    const repeat = seen.has(node)
    seen.add(node)
    rows.push({ node, guide, repeat })
    if (repeat) return // a node reached twice is shown once expanded, then folded
    const cs = kids[node] || []
    const cp = isRoot ? '' : prefix + (isLast ? '    ' : '│   ')
    cs.forEach((c, i) => walk(c, cp, i === cs.length - 1, false))
  }
  roots.forEach((r, i) => walk(r, '', i === roots.length - 1, true))
  return `<div class="callgraph">${rows.map(r => {
    const view = r.repeat ? '' : `<button class="cg-view" data-goto="${esc(r.node)}" title="${esc(L.viewChangeTitle)}">${esc(L.viewChange)}</button>`
    return `<div class="cg-row"><span class="cg-guide">${esc(r.guide)}</span>` +
      `<button class="cg-node" data-gofile="${esc(r.node)}" style="--sc:${gcolor(fileGroup[r.node])}" title="${esc(L.jumpToFile)}">` +
      `${fileIconSVG(r.node)}${esc(shortName(r.node))}${r.repeat ? ' <span class="cg-rep">↩</span>' : ''}</button>${view}</div>`
  }).join('')}</div>`
}
function showOverview() {
  setActive(null)
  setAsideWide(false)
  // On a prose tab the idle legend is exactly what the panel was collapsed to
  // avoid, so "back" there gives the width back instead of rendering it. No new
  // affordance needed: the next file click reopens the panel.
  if (!ASIDE_TABS.has(currentTab)) return applyAside(currentTab)
  const cg = asideIndexView === 'callgraph'
  const subtabs = `<div class="aside-subtabs" role="tablist">
    <button class="aside-subtab${cg ? '' : ' on'}" data-asideview="overview">${esc(L.overviewTag)}</button>
    <button class="aside-subtab${cg ? ' on' : ''}" data-asideview="callgraph">${esc(L.callGraphTab)}</button></div>`
  inspector.innerHTML = subtabs + (cg
    ? callGraphHTML()
    : `<h3 class="prose">${esc(RM.meta.title || RM.meta.project)}</h3>
       ${overviewGroupsHTML()}
       <p class="note">${L.completeness(RM.manifest.length)} · <button class="linklike" data-help>${L.helpLink}</button></p>`)
  if (cg) return
  // reveal the more/less toggle only where the one-line note actually clips
  inspector.querySelectorAll('.ovg-note').forEach(note => {
    const btn = note.nextElementSibling
    if (!btn || !btn.classList.contains('ovg-note-more')) return
    if (note.scrollHeight - note.clientHeight > 1) btn.classList.add('show')
  })
}
function setActive(id) {
  activeId = id
  for (const [k, el] of Object.entries(nodeEls)) el.classList.toggle('active', k === id)

  const go = (fn) => { e.preventDefault(); fn() }

  if (k === 't') return go(() => { applyPalette(PALETTES[(PALETTES.indexOf(document.documentElement.dataset.p || 'slate') + 1) % PALETTES.length]); renderHelp() })
  if (k === 'g') return go(() => scrollTo({ top: 0, behavior: 'smooth' }))

  if (k === 'n') return go(() => document.querySelector('.rail .bm')?.click())
  if (k === 'A') return go(() => { for (const f of allPaths) seen.add(f); SESSION.set('seen', [...seen]); refreshSeen() })
