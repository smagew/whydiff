// ── ask ──────────────────────────────────────────────────────────────────────
// Live Q&A about an anchored piece of this report. Only reachable when the page
// is served by scripts/serve.mjs, which injects the token below — the assembled
// file and the published artifact have no endpoint to talk to, so the whole
// feature stays absent rather than visibly broken.
const SERVE = window.__WHYDIFF_SERVE__
if (SERVE?.token) (() => {
  document.body.classList.add('can-ask')

  // ── markdown ───────────────────────────────────────────────────────────────
  // A small renderer rather than a library: the page must stay self-contained,
  // and a published artifact's CSP would block a CDN anyway. Everything is
  // escaped before any markup is produced, so an answer cannot inject HTML.
  const mdToHtml = (src) => {
    const fences = []
    let s = String(src == null ? '' : src).replace(/```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      fences.push(`<pre><code>${hl(code.replace(/\n$/, ''), lang ? (HLJS_LANG[lang.toLowerCase()] || lang) : null)}</code></pre>`)
      return `F${fences.length - 1}`
    })
    s = esc(s)
    const spans = []
    const hold = (html) => `S${spans.push(html) - 1}`
    s = s.replace(/`([^`\n]+)`/g, (_, c) => hold(`<code>${c}</code>`))
    s = s.replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g, (_, t, u) => hold(`<a href="${u}" target="_blank" rel="noopener">${t}</a>`))
    s = s.replace(/\*\*([^*\n]+)\*\*/g, (_, t) => hold(`<strong>${t}</strong>`))
    s = s.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, (_, p, t) => p + hold(`<em>${t}</em>`))
    s = s.replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,;:!?]|$)/g, (_, p, t) => p + hold(`<em>${t}</em>`))

    const out = []
    let list = null // 'ul' | 'ol'
    const closeList = () => { if (list) { out.push(`</${list}>`); list = null } }
    for (const raw of s.split('\n')) {
      const line = raw.trimEnd()
      if (/^F\d+$/.test(line.trim())) { closeList(); out.push(line.trim()); continue }
      if (!line.trim()) { closeList(); continue }
      const h = line.match(/^(#{1,6})\s+(.*)$/)
      if (h) { closeList(); out.push(`<h3>${h[2]}</h3>`); continue }
      // The line is already escaped at this point, so the marker is &gt;, not >.
      const q = line.match(/^&gt;\s?(.*)$/)
      if (q) { closeList(); out.push(`<blockquote>${q[1]}</blockquote>`); continue }
      const ul = line.match(/^\s*[-*+]\s+(.*)$/)
      if (ul) { if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul' } out.push(`<li>${ul[1]}</li>`); continue }
      const ol = line.match(/^\s*\d+[.)]\s+(.*)$/)
      if (ol) { if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol' } out.push(`<li>${ol[1]}</li>`); continue }
      closeList()
      out.push(`<p>${line}</p>`)
    }
    closeList()
    return out.join('')
      .replace(/S(\d+)/g, (_, i) => spans[+i])
      .replace(/F(\d+)/g, (_, i) => fences[+i])
  }

  const api = async (path, body, raw) => {
    const res = await fetch('/api/' + path, {
      method: body ? 'POST' : 'GET',
      headers: { 'x-whydiff-token': SERVE.token, ...(body ? { 'content-type': 'application/json' } : {}) },
      ...(body ? { body: JSON.stringify(body) } : {}),
    })
    if (raw) { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res }
    const data = await res.json().catch(() => ({}))
    if (!res.ok) { const err = new Error(data.error || `HTTP ${res.status}`); err.data = data; err.status = res.status; throw err }
    return data
  }

  // ── state ──────────────────────────────────────────────────────────────────
  let threads = []
  let current = null
  const numbers = new Map()   // anchorKey → the number shown on its marker
  const renumber = () => {
    numbers.clear()
    for (const t of threads) if (!numbers.has(t.anchorKey)) numbers.set(t.anchorKey, numbers.size + 1)
  }
  const forKey = (k) => threads.filter(t => t.anchorKey === k)

  // ── panel (right column, full height) ──────────────────────────────────────
  const panel = document.createElement('section')
  panel.className = 'askpanel'
  panel.innerHTML = `
    <div class="dk-head"><b>${esc(L.askTitle)}</b><span class="grow"></span>
      <button class="dk-btn dk-insp" title="${esc(L.askShowInspector)}">${esc(L.askInspector)}</button>
      <button class="dk-x" aria-label="${esc(L.close)}">✕</button></div>
    <div class="dk-anchor"></div><div class="dk-quote" hidden></div>
    <div class="dk-threads"></div>
    <div class="dk-form">
      <div class="dk-mode">
        <button data-mode="ask" class="on" title="${esc(L.modeAskTitle)}">${esc(L.modeAsk)}</button>
        <button data-mode="instruct" title="${esc(L.modeInstructTitle)}">${esc(L.modeInstruct)}</button>
        <button data-mode="propose" title="${esc(L.modeProposeTitle)}">${esc(L.modePropose)}</button>
        <button data-mode="note" title="${esc(L.modeNoteTitle)}">${esc(L.modeNote)}</button>
      </div>
      <textarea placeholder="${esc(L.askPlaceholder)}"></textarea>
      <div class="dk-row"><span class="dk-hint">${esc(L.askHint)}</span><button class="btn primary dk-send">${esc(L.askSend)}</button></div>
      <div class="dk-err" hidden></div>
    </div>`
  document.getElementById('rightcol').appendChild(panel)
  const dkAnchor = panel.querySelector('.dk-anchor')
  const dkQuote = panel.querySelector('.dk-quote')
  const dkThreads = panel.querySelector('.dk-threads')
  const dkText = panel.querySelector('textarea')
  const dkSend = panel.querySelector('.dk-send')
  const dkErr = panel.querySelector('.dk-err')
  const dkHint = panel.querySelector('.dk-hint')

  // Two speech acts, one place: a question about this bit, or an instruction to
  // change it. The switch changes what the reply is — an answer, or a plan the
  // reviewer approves — not which panel you are in.
  // Options are the third act: the reviewer types nothing, because the finding the
  // map already reported IS the question. That is also why the mode is refused
  // anywhere else — a proposal must cite a finding, and a text selection is not one.
  let mode = 'ask'
  const proposeBtn = panel.querySelector('.dk-mode button[data-mode="propose"]')
  const canPropose = (anchor) => !!anchor && (
    ['finding', 'gap'].includes(anchor.kind) || !!elFor(anchor.key)?.classList.contains('fixable'))
  const setMode = (next) => {
    mode = next
    for (const b of panel.querySelectorAll('.dk-mode button')) b.classList.toggle('on', b.dataset.mode === next)
    dkText.hidden = next === 'propose'
    dkText.placeholder = next === 'note' ? L.notePlaceholder : next === 'instruct' ? L.instructPlaceholder : L.askPlaceholder
    dkHint.textContent = next === 'ask' ? L.askHint : next === 'instruct' ? L.instructHint : next === 'note' ? L.noteHint : L.proposeHint
    dkSend.textContent = next === 'ask' ? L.askSend : next === 'instruct' ? L.instructSend : next === 'note' ? L.noteSend : L.proposeSend
  }
  for (const b of panel.querySelectorAll('.dk-mode button')) {
    b.addEventListener('click', () => { if (!b.disabled) { setMode(b.dataset.mode); if (!dkText.hidden) dkText.focus() } })
  }

  const closePanel = () => {
    panel.classList.remove('on')
    layoutEl.classList.remove('chatting')
    current = null
    applyAside(currentTab)
    layoutRail()
  }
  panel.querySelector('.dk-x').addEventListener('click', closePanel)
  // The inspector lives in the same column; this hands it back without losing
  // the open thread — its marker reopens it.
  panel.querySelector('.dk-insp').addEventListener('click', () => {
    layoutEl.classList.remove('chatting')
    panel.classList.remove('on')
    revealAside()
    layoutRail()
  })

  // ── multi-select bar + selection button ────────────────────────────────────
  const bar = document.createElement('div')
  bar.className = 'askbar'
  bar.innerHTML = `<span class="bar-n"></span><button class="btn primary bar-ask">${esc(L.askSelected)}</button><button class="btn bar-clear">${esc(L.askClear)}</button>`
  document.body.appendChild(bar)
  const selBtn = document.createElement('button')
  selBtn.className = 'asksel'
  selBtn.textContent = L.askAboutSelection
  document.body.appendChild(selBtn)
  const rail = document.createElement('div')
  rail.className = 'rail'
  document.body.appendChild(rail)

  // ── anchors ────────────────────────────────────────────────────────────────
  const textOf = (el) => {
    const c = el.cloneNode(true)
    for (const x of c.querySelectorAll('.askbtn, .askmark, .askpin')) x.remove()
    return (c.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 1800)
  }
  const filesOf = (el) => [...el.querySelectorAll('[data-goto]')].map(x => x.dataset.goto)
  const anchorOf = (el) => ({
    kind: el.dataset.anchor.split(':')[0],
    key: el.dataset.anchor,
    label: el.dataset.anchorLabel || el.dataset.anchor,
    files: filesOf(el),
    context: textOf(el),
    lang: RM.meta.lang,
  })
  // A question about one diagram node has no element of its own (mermaid nodes are
  // SVG, which cannot host the marker), so it falls back to its diagram — the
  // bookmark still lands you in the right place instead of reading as "lost".
  const elFor = (key) => document.querySelector(`[data-anchor="${CSS.escape(key)}"]`)
    || (/^diagram:\d+:/.test(key) ? document.querySelector(`[data-anchor="${CSS.escape(key.split(':').slice(0, 2).join(':'))}"]`) : null)

  // A selection question leaves the quoted text highlighted, the way a comment
  // does in a document — otherwise the question has no visible home to return to.
  const wrapQuote = (quote, key) => {
    if (!quote || elFor(key)) return
    const root = document.querySelector('.wrap')
    const nodes = []
    let flat = ''
    const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => (n.parentElement.closest('script, style, .rail, .askpanel, .askbar, .asksel, svg'))
        ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
    })
    for (let n = walk.nextNode(); n; n = walk.nextNode()) { nodes.push([n, flat.length]); flat += n.nodeValue }
    // Whitespace differs between the DOM and the stored quote, so search on a
    // collapsed copy and map the hit back to real offsets.
    const map = []
    let norm = ''
    for (let i = 0; i < flat.length; i++) {
      const ch = /\s/.test(flat[i]) ? ' ' : flat[i]
      if (ch === ' ' && norm.endsWith(' ')) continue
      map.push(i); norm += ch
    }
    const needle = quote.replace(/\s+/g, ' ').trim()
    const at = norm.indexOf(needle)
    if (at < 0) return
    const from = map[at], to = map[Math.min(at + needle.length - 1, map.length - 1)] + 1
    const locate = (pos) => {
      for (const [n, base] of nodes) if (pos >= base && pos <= base + n.nodeValue.length) return [n, pos - base]
      return null
    }
    // Wrap each intersecting text node separately. A single surroundContents()
    // throws whenever the selection crosses an element boundary — which here is
    // the common case, since the prose is full of inline <code> and <b>.
    const pieces = []
    for (const [n, base] of nodes) {
      const s = Math.max(from, base), e = Math.min(to, base + n.nodeValue.length)
      if (e > s) pieces.push([n, s - base, e - base])
    }
    if (!pieces.length) return
    const wrapped = []
    for (const [node, s, e] of pieces) {
      let target = node
      if (e < target.nodeValue.length) target.splitText(e)
      if (s > 0) target = target.splitText(s)
      const span = document.createElement('span')
      span.className = 'askquote'
      target.parentNode.insertBefore(span, target)
      span.appendChild(target)
      wrapped.push(span)
    }
    // The anchor lives on the first piece; the pin goes after the last, the way
    // a comment marker sits at the end of the commented phrase.
    wrapped[0].dataset.anchor = key
    wrapped[0].dataset.anchorLabel = needle.slice(0, 90)
    if (wrapped.length > 1) wrapped[wrapped.length - 1].dataset.askPinHere = key
  }

  // ── markers ────────────────────────────────────────────────────────────────
  const refreshMarks = () => {
    renumber()
    for (const t of threads) if (t.anchor?.kind === 'selection' && t.anchor.quote) wrapQuote(t.anchor.quote, t.anchorKey)
    for (const el of document.querySelectorAll('[data-anchor]')) {
      const key = el.dataset.anchor
      const n = numbers.get(key)
      const count = forKey(key).length
      const isQuote = el.classList.contains('askquote')
      // A multi-piece highlight puts its pin after the last piece, so the marker
      // sits at the end of the phrase rather than in the middle of it.
      // Diagrams put their marker in the header strip, next to ⛶ and ⧉, rather
      // than floating it over the rendered graph.
      const pinHost = isQuote
        ? (document.querySelector(`[data-ask-pin-here="${CSS.escape(key)}"]`) || el)
        : (el.querySelector(':scope > .dg-head > .dg-actions') || el)
      let mark = pinHost.querySelector(`:scope > .${isQuote ? 'askpin' : 'askmark'}`)
      if (n) {
        if (!mark) {
          mark = document.createElement('button')
          mark.className = isQuote ? 'askpin' : 'askmark'
          mark.addEventListener('click', (e) => { e.stopPropagation(); e.preventDefault(); openFor(anchorOf(el)) })
          pinHost.appendChild(mark)
        }
        mark.textContent = count > 1 ? `${n}·${count}` : String(n)
        mark.title = L.askOpenThread(count)
      } else if (mark) mark.remove()

      // The hover "ask" affordance only makes sense where no marker sits yet.
      if (el.classList.contains('askable')) {
        let b = el.querySelector(':scope > .askbtn')
        if (n && b) b.remove()
        else if (!n && !b) {
          b = document.createElement('button')
          b.className = 'askbtn'
          b.textContent = L.askBadge
          b.title = L.askAbout
          b.addEventListener('click', (e) => { e.stopPropagation(); openFor(anchorOf(el)) })
          el.appendChild(b)
        }
      }
    }
    layoutRail()
    drawDiagramMarks() // a new question or note may have annotated a diagram place
  }

  // ── left rail: bookmarks at the height of their anchor ─────────────────────
  const tabOfEl = (el) => el?.closest('.pane')?.id?.replace('pane-', '') || null
  // Diagram anchors only become real elements once mermaid has drawn that pane.
  // Until then the key still says which tab the question belongs to, so it is
  // counted there rather than reported as having lost its place.
  const tabFromKey = (key) => key.startsWith('diagram:') ? 'diagrams'
    : key.startsWith('story:') ? 'stories'
    : /^blocks?:/.test(key) ? 'story' : null
  let railRaf = 0
  function layoutRail() {
    cancelAnimationFrame(railRaf)
    railRaf = requestAnimationFrame(() => {
      // Every question is a stable count on its own tab — the single, non-shifting
      // representation. It stays whether or not the tab is active, so the tab width
      // never changes; and there is NO floating rail and NO reserved left gutter, so
      // switching tabs never moves the content sideways. Threads open from the
      // in-content markers and the Review view; anchor-less ones live in Review.
      const perTab = new Map()
      for (const key of numbers.keys()) {
        const tab = tabOfEl(elFor(key)) || tabFromKey(key)
        if (tab) perTab.set(tab, (perTab.get(tab) || 0) + 1)
      }
      for (const b of tabsEl.querySelectorAll('.tab')) {
        const n = perTab.get(b.dataset.pane) || 0
        let q = b.querySelector('.qcnt')
        if (!n) { q?.remove(); continue }
        if (!q) { q = document.createElement('span'); q.className = 'qcnt'; b.appendChild(q) }
        q.textContent = n
        q.title = L.askOnThisTab(n)
      }
      rail.innerHTML = ''
      rail.classList.remove('on')
      document.body.classList.remove('has-marks')
    })
  }
  const jumpTo = (e, tries = 0) => {
    if (e.tab && e.tab !== currentTab) setTab(e.tab)
    const el = elFor(e.key)
    // A diagram's anchor appears only after mermaid has drawn it, which is a few
    // frames after the tab opens — wait for it rather than declaring it lost.
    if (!el && e.tab === 'diagrams' && tries < 40) return setTimeout(() => jumpTo(e, tries + 1), 100)
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' })
      openFor(anchorOf(el))
    } else {
      // The anchor's text is gone (the report was regenerated) — the thread is
      // still worth reading, so open it without a place to scroll to.
      const t = forKey(e.key)[0]
      openFor({ ...(t?.anchor || {}), key: e.key, label: t?.anchor?.label || e.key })
    }
  }
  addEventListener('scroll', layoutRail, { passive: true })
  addEventListener('resize', layoutRail)
  new MutationObserver(layoutRail).observe(document.querySelector('.main-panel'), { attributes: true, attributeFilter: ['hidden'], subtree: true })

  // ── multi-select of Logic blocks ───────────────────────────────────────────
  const picked = new Set()
  const syncBar = () => {
    bar.classList.toggle('on', picked.size > 1)
    bar.querySelector('.bar-n').textContent = L.askPickedN(picked.size)
  }
  const clearPicked = () => { for (const el of picked) el.classList.remove('picked'); picked.clear(); syncBar() }
  storyEl.addEventListener('click', (e) => {
    if (!(e.metaKey || e.ctrlKey || e.shiftKey)) return
    const step = e.target.closest('.step[data-anchor]')
    if (!step) return
    e.preventDefault()
    if (picked.has(step)) { picked.delete(step); step.classList.remove('picked') }
    else { picked.add(step); step.classList.add('picked') }
    syncBar()
  })
  bar.querySelector('.bar-clear').addEventListener('click', clearPicked)
  bar.querySelector('.bar-ask').addEventListener('click', () => {
    const els = [...picked]
    openFor({
      kind: 'blocks',
      key: 'blocks:' + els.map(e => e.dataset.anchor.split(':')[1]).join('+'),
      label: els.map(e => e.dataset.anchorLabel).join(' | '),
      files: [...new Set(els.flatMap(filesOf))],
      context: els.map(e => textOf(e)).join('\n\n---\n\n'),
      lang: RM.meta.lang,
    })
  })

  // ── text selection ─────────────────────────────────────────────────────────
  const hideSel = () => { selBtn.style.display = 'none' }
  document.addEventListener('mouseup', (e) => {
    if (e.target.closest('.askpanel') || e.target === selBtn) return
    setTimeout(() => {
      const sel = window.getSelection()
      const quote = (sel?.toString() || '').replace(/\s+/g, ' ').trim()
      if (!sel || sel.isCollapsed || quote.length < 3 || !sel.anchorNode?.parentElement?.closest('.wrap')) return hideSel()
      const r = sel.getRangeAt(0).getBoundingClientRect()
      selBtn.style.display = 'block'
      selBtn.style.top = `${Math.max(6, r.top + scrollY - 34)}px`
      selBtn.style.left = `${Math.max(6, r.left + scrollX)}px`
      selBtn.onclick = () => {
        const host = sel.anchorNode?.parentElement?.closest('[data-anchor]')
        hideSel()
        openFor({
          kind: 'selection',
          key: 'sel:' + quote.slice(0, 60).toLowerCase().replace(/[^a-z0-9]+/g, '-'),
          label: quote.slice(0, 90),
          quote,
          files: host ? filesOf(host) : [],
          context: host ? textOf(host) : '',
          lang: RM.meta.lang,
        })
      }
    }, 0)
  })
  addEventListener('scroll', hideSel, { passive: true })

  // ── diagrams ───────────────────────────────────────────────────────────────
  const nodeText = (n) => (n.textContent || '').replace(/\s+/g, ' ').trim()
  // nslug is defined in the inlined viewer-logic module at the top of this script.
  // Every annotatable element across the mermaid diagram types whydiff emits — not just
  // flowchart `.node`, so region context and node badges also see entities (ER), classes,
  // states and sequence actors. The region FRAME does not depend on this (it is geometric),
  // so a type this misses still gets a visible, redrawable frame.
  const DG_NODE_SEL = 'svg .node, svg g[id^="entity-"], svg .classGroup, svg .stateGroup, svg .actor'
  const dgNodes = (scope) => [...scope.querySelectorAll(DG_NODE_SEL)]
  const nodeAnchor = (dg, i, label) => ({
    kind: 'diagram-node',
    key: `diagram:${i}:${nslug(label).slice(0, 40)}`,
    label: `${dg.querySelector('h3')?.textContent || ''} → ${label}`,
    files: filesOf(dg),
    context: `Node "${label}" in this diagram:\n${(RM.diagrams?.[i]?.mermaid || '').slice(0, 2500)}`,
    lang: RM.meta.lang,
  })
  // Small monochrome glyphs (currentColor), within the design system: a chat bubble
  // for a place with a discussion (question answered / plan / options), a pencil for
  // a place carrying a bare note.
  const CHAT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
  const NOTE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>'

  // Redraw the persisted annotations on every diagram from the journal: a badge on
  // each annotated node, and a dashed frame + badge around each annotated region.
  // Called after every (re-)render, because mermaid rebuilds the SVG and pixel
  // positions with it. No MutationObserver, so these DOM writes never re-trigger it.
  function drawDiagramMarks() {
    const pane = document.getElementById('pane-diagrams')
    if (!pane) return
    pane.querySelectorAll('.dg-region, .dg-badges').forEach(el => el.remove())
    pane.querySelectorAll('.diagram').forEach((dg, i) => {
      const box = dg.querySelector('.mermaid-box')
      if (!box || !box.querySelector('svg')) return
      const br = box.getBoundingClientRect()
      const svgNodes = dgNodes(box)
      // One entry per annotated anchor on this diagram, with the kinds it carries.
      const byKey = new Map()
      for (const t of threads) {
        if (!t.anchorKey?.startsWith(`diagram:${i}:`)) continue
        const e = byKey.get(t.anchorKey) || { anchor: t.anchor, chat: false, note: false }
        if (t.kind === 'note') e.note = true; else e.chat = true
        byKey.set(t.anchorKey, e)
      }
      const badgesEl = (anchor, chat, note) => {
        const wrap = document.createElement('div')
        wrap.className = 'dg-badges'
        for (const [on, icon, title] of [[chat, CHAT_ICON, L.dgBadgeChat], [note, NOTE_ICON, L.dgBadgeNote]]) {
          if (!on) continue
          const b = document.createElement('button')
          b.type = 'button'; b.className = 'dg-badge'; b.title = title; b.innerHTML = icon
          b.addEventListener('click', (e) => { e.stopPropagation(); openFor(anchor) })
          wrap.appendChild(b)
        }
        return wrap
      }
      const place = (wrap, right, top) => {
        wrap.style.left = (right - br.left + box.scrollLeft - 12) + 'px'
        wrap.style.top = (top - br.top + box.scrollTop - 8) + 'px'
        box.appendChild(wrap)
      }
      for (const [key, e] of byKey) {
        if (/:region:/.test(key)) {
          let L1, T1, R1, B1
          const svg = box.querySelector('svg')
          const ctm = svg && svg.getScreenCTM && svg.getScreenCTM()
          const rr = e.anchor?.rect
          if (rr && ctm && (rr.w > 1.5 || rr.h > 1.5)) {
            // SVG-space anchor: map the stored rect back to the screen through the CURRENT
            // transform — so it lands on the same area whatever the diagram's present scale,
            // centring, scroll or layout. Type-agnostic; needs no node detection.
            const a = new DOMPoint(rr.x, rr.y).matrixTransform(ctm), b = new DOMPoint(rr.x + rr.w, rr.y + rr.h).matrixTransform(ctm)
            L1 = Math.min(a.x, b.x); T1 = Math.min(a.y, b.y); R1 = Math.max(a.x, b.x); B1 = Math.max(a.y, b.y)
          } else if (rr && svg) {
            // Legacy fraction-of-box rect (pre SVG-space anchors).
            const sr = svg.getBoundingClientRect()
            L1 = sr.left + rr.x * sr.width; T1 = sr.top + rr.y * sr.height; R1 = L1 + rr.w * sr.width; B1 = T1 + rr.h * sr.height
          } else {
            // Legacy anchor (pre-geometry): hug the covered nodes by label.
            const labels = new Set((e.anchor?.nodes || []).map(String))
            const inside = svgNodes.filter(n => labels.has(nodeText(n).slice(0, 60)))
            if (!inside.length) continue
            L1 = Infinity; T1 = Infinity; R1 = -Infinity; B1 = -Infinity
            for (const n of inside) { const b = n.getBoundingClientRect(); L1 = Math.min(L1, b.left); T1 = Math.min(T1, b.top); R1 = Math.max(R1, b.right); B1 = Math.max(B1, b.bottom) }
          }
          const pad = 6
          const fr = document.createElement('div')
          fr.className = 'dg-region'
          fr.style.left = (L1 - br.left + box.scrollLeft - pad) + 'px'
          fr.style.top = (T1 - br.top + box.scrollTop - pad) + 'px'
          fr.style.width = (R1 - L1 + pad * 2) + 'px'
          fr.style.height = (B1 - T1 + pad * 2) + 'px'
          box.appendChild(fr)
          place(badgesEl(e.anchor, e.chat, e.note), R1 + pad, T1 - pad)
        } else {
          // A node anchor: find the node whose label slug matches the key's tail.
          const slug = key.slice(`diagram:${i}:`.length)
          const node = svgNodes.find(n => nslug(nodeText(n).slice(0, 90)).slice(0, 40) === slug)
          if (!node) continue
          const b = node.getBoundingClientRect()
          place(badgesEl(e.anchor, e.chat, e.note), b.right, b.top)
        }
      }
    })
  }

  const wireDiagrams = () => {
    // Guarded: this runs from a MutationObserver on the pane, and refreshMarks()
    // inserts a marker into that same pane. Only a genuinely new anchor triggers
    // a redraw, so the two cannot chase each other.
    let fresh = false
    document.querySelectorAll('#pane-diagrams .diagram').forEach((dg, i) => {
      // The diagram itself is an anchor, so its questions get a marker and a rail
      // bookmark like anywhere else. Not .askable: the "?" in the header below is
      // already the ask affordance here.
      if (!dg.dataset.anchor) {
        dg.dataset.anchor = `diagram:${i}`
        dg.dataset.anchorLabel = dg.querySelector('h3')?.textContent || `diagram ${i + 1}`
        fresh = true
      }
      const head = dg.querySelector('.dg-actions')
      if (head && !head.querySelector('.dg-ask')) {
        const b = document.createElement('button')
        b.className = 'dg-btn dg-ask'
        b.textContent = '?'
        b.title = L.askAboutDiagram
        b.addEventListener('click', () => openFor({
          kind: 'diagram',
          key: `diagram:${i}`,
          label: dg.querySelector('h3')?.textContent || `diagram ${i + 1}`,
          files: filesOf(dg),
          context: (RM.diagrams?.[i]?.mermaid || '').slice(0, 2500),
          lang: RM.meta.lang,
        }))
        head.appendChild(b)
      }
      // Node click and region drag are delegated to the BOX, not wired per node:
      // mermaid rebuilds the node elements on every render (palette switch, re-open),
      // but the box persists — so one listener on it survives, where per-node
      // listeners would silently be lost.
      const box = dg.querySelector('.mermaid-box')
      if (box && !box.dataset.selWired) {
        box.dataset.selWired = '1'
        // A plain click on a block opens the panel to ask or note about it. Capture +
        // stopImmediate so mermaid's own click directive (which would open the file)
        // does not also fire — the file stays reachable from the chips below.
        box.addEventListener('click', (e) => {
          const node = e.target.closest?.('.node, .er.entityBox, g[id^="entity-"]')
          if (!node || !box.contains(node)) return
          e.preventDefault(); e.stopImmediatePropagation()
          openFor(nodeAnchor(dg, i, nodeText(node).slice(0, 90)))
        }, true)
        // Drag a rectangle over the diagram to ask about a REGION, not one node: on
        // release, the nodes the box covers become the anchor's context. A plain
        // click (no movement) is left to the click handler above.
        box.addEventListener('mousedown', (e) => {
          if (e.button !== 0) return
          // Suppress the native text-selection this drag would otherwise start (which used
          // to hijack the gesture and pop the "ask about text" hint instead).
          e.preventDefault()
          const r = box.getBoundingClientRect()
          const sx = e.clientX, sy = e.clientY
          let sel = null, dragging = false
          const move = (ev) => {
            if (!dragging && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return
            if (!dragging) { dragging = true; box.classList.add('dg-dragging'); sel = document.createElement('div'); sel.className = 'dg-select'; box.appendChild(sel) }
            ev.preventDefault()
            sel.style.left = (Math.min(ev.clientX, sx) - r.left + box.scrollLeft) + 'px'
            sel.style.top = (Math.min(ev.clientY, sy) - r.top + box.scrollTop) + 'px'
            sel.style.width = Math.abs(ev.clientX - sx) + 'px'
            sel.style.height = Math.abs(ev.clientY - sy) + 'px'
          }
          const up = (ev) => {
            document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up)
            box.classList.remove('dg-dragging')
            if (sel) sel.remove()
            window.getSelection?.()?.removeAllRanges?.()
            if (!dragging) return // it was a click — leave node drill-down to its own handler
            // Geometry-first anchor, in the SVG's OWN coordinate system (via getScreenCTM),
            // not screen fractions: this is invariant to scale, centring (margin:auto), scroll
            // and re-layout — all of which happen between the drag and the redraw (opening the
            // ask panel narrows the column and refits the diagram). So the frame returns to the
            // exact area on ANY diagram type, even one with no discrete nodes. Covered node
            // labels ride along as context for the model, best-effort (empty is fine).
            const svg = box.querySelector('svg')
            const ctm = svg && svg.getScreenCTM && svg.getScreenCTM()
            const vb = svg && svg.viewBox && svg.viewBox.baseVal
            if (!ctm || !vb || !vb.width || !vb.height) return
            const dl = Math.min(ev.clientX, sx), dt = Math.min(ev.clientY, sy)
            const dr = Math.max(ev.clientX, sx), db = Math.max(ev.clientY, sy)
            const inv = ctm.inverse()
            const u1 = new DOMPoint(dl, dt).matrixTransform(inv), u2 = new DOMPoint(dr, db).matrixTransform(inv)
            const rect = { x: Math.min(u1.x, u2.x), y: Math.min(u1.y, u2.y), w: Math.abs(u2.x - u1.x), h: Math.abs(u2.y - u1.y) }
            if (rect.w / vb.width < 0.02 || rect.h / vb.height < 0.02) return // too small to be a deliberate region
            const covered = [...new Set(dgNodes(dg).filter((n) => {
              const b = n.getBoundingClientRect()
              return b.left < dr && b.right > dl && b.top < db && b.bottom > dt
            }).map((n) => nodeText(n).slice(0, 60)).filter(Boolean))]
            const title = dg.querySelector('h3')?.textContent || ''
            const rk = [rect.x, rect.y, rect.w, rect.h].map((v) => Math.round(v)).join('-')
            openFor({
              kind: 'diagram-region',
              key: `diagram:${i}:region:${rk}`,
              label: `${title} → ${covered.length ? covered.slice(0, 3).join(', ') + (covered.length > 3 ? '…' : '') : L.dgRegionArea}`,
              files: filesOf(dg),
              nodes: covered,
              rect,
              context: `A selected region of this diagram${covered.length ? ` covers these nodes: ${covered.join('; ')}` : ' (a free area — no discrete nodes)'}.\nFull diagram:\n${(RM.diagrams?.[i]?.mermaid || '').slice(0, 2500)}`,
              lang: RM.meta.lang,
            })
          }
          document.addEventListener('mousemove', move); document.addEventListener('mouseup', up)
        })
      }
    })
    if (fresh) refreshMarks()
    drawDiagramMarks()
  }
  // Re-wire and repaint when a render rebuilds the SVG (first open, palette switch),
  // but IGNORE our own annotation writes (badges/frames) — otherwise painting them
  // would re-trigger the observer forever. So the observer reacts to real diagram
  // mutations only, and drawDiagramMarks can add its overlay without a disconnect.
  const dgPane = document.getElementById('pane-diagrams')
  const isOurs = (n) => n.nodeType === 1 && (n.classList?.contains('dg-badges') || n.classList?.contains('dg-region'))
  new MutationObserver((muts) => {
    if (muts.some(m => [...m.addedNodes, ...m.removedNodes].some(n => !isOurs(n)))) wireDiagrams()
  }).observe(dgPane, { childList: true, subtree: true })
  tabsEl.querySelector('.tab[data-pane="diagrams"]')?.addEventListener('click', wireDiagrams)

  // ── conversation ───────────────────────────────────────────────────────────
  const traceHTML = (steps, open) => !steps?.length ? '' : `
    <details class="trace"${open ? ' open' : ''}><summary>${esc(L.askTrace(steps.length))}</summary>
      <div class="tr-body">${steps.map(s => `<div class="tr-step">${esc(s)}</div>`).join('')}</div></details>`
  const accText = (a) => (L.acc[a?.type] || ((v) => v))(a?.name || a?.key || a?.what || '')
  // A plan is read to decide on, so its fields are laid out rather than buried in
  // prose: what changes, what proves it, what could break, what is still unknown.
  const planHTML = (plan) => !plan ? '' : `
    <div class="dk-plan"><dl>
      <dt>${esc(L.planSpec)}</dt><dd>${esc(plan.spec)}</dd>
      <dt>${esc(L.planAcceptance)}</dt><dd>${esc(accText(plan.acceptance))}</dd>
      ${plan.files?.length ? `<dt>${esc(L.planFiles)}</dt><dd>${plan.files.map(f => `<code>${esc(f)}</code>`).join(', ')}</dd>` : ''}
      ${plan.risks?.length ? `<dt>${esc(L.planRisks)}</dt><dd>${esc(plan.risks.join('; '))}</dd>` : ''}
      ${plan.questions?.length ? `<dt class="dk-ask">${esc(L.planQuestions)}</dt><dd class="dk-ask">${esc(plan.questions.join('; '))}</dd>` : ''}
    </dl></div>`
  // What the reviewer does next with a plan: agree (a task opens), turn it down
  // (recorded, so the offer is not made again), or — once a task exists — see its
  // state. Nothing here starts work; the task is a queue the session drains.
  // Options differ in KIND, so the kind leads each one: a point fix, a fix at the
  // root, or a decision not to change behaviour at all. Same criterion field as a
  // plan, because a chosen option becomes a task the same way.
  const variantsHTML = (p, i) => !p ? '' : (p.noFixNeeded
    ? `<div class="dk-plan"><dl><dt>${esc(L.proposeNoFix)}</dt><dd>${esc(p.noFixNeeded)}</dd></dl></div>`
    : p.variants.map((v, vi) => `<div class="dk-var"><div class="dk-vhead"><span class="vk ${esc(v.kind)}">${esc(L.variantKind[v.kind] || v.kind)}</span>
        <b>${esc(v.what)}</b></div>
      <dl>${v.cost ? `<dt>${esc(L.variantCost)}</dt><dd>${esc(v.cost)}</dd>` : ''}
        ${v.risk ? `<dt>${esc(L.variantRisk)}</dt><dd>${esc(v.risk)}</dd>` : ''}
        ${v.blast?.length ? `<dt>${esc(L.variantBlast)}</dt><dd>${v.blast.map(f => `<code>${esc(f)}</code>`).join(', ')}</dd>` : ''}
        <dt>${esc(L.planAcceptance)}</dt><dd>${esc(accText(v.acceptance))}</dd></dl>
      <div class="dk-acts"><button class="btn primary dk-pick" data-i="${i}" data-v="${vi}">${esc(L.variantChoose)}</button></div></div>`).join(''))

  // What the reviewer does next with a plan or a set of options: agree/choose (a
  // task opens), turn it down (recorded, so the offer is not made again), or — once
  // a task exists — see its state. Nothing here starts work.
  // Turning what you just read into work, without retyping it and without a second
  // model call. A first live session ended with the reviewer writing "ok add to task"
  // into the Ask box and being told the session cannot write files — the answer was
  // right there and there was no way to act on it.
  const ACC_KINDS = ['manual', 'test', 'story', 'finding']
  const taskFormHTML = (i, spec, acc) => `<div class="dk-tf" data-i="${i}">
    <label class="dk-tfl">${esc(L.taskSpecLabel)}</label>
    <textarea class="tf-spec" placeholder="${esc(L.taskSpecHint)}">${esc(spec || '')}</textarea>
    <label class="dk-tfl">${esc(L.taskAccLabel)}</label>
    <div class="dk-row">
      <select class="tf-type">${ACC_KINDS.map(k => `<option value="${k}"${acc?.type === k ? ' selected' : ''}>${esc(L.accKind[k])}</option>`).join('')}</select>
      <input class="tf-val" value="${esc(acc?.name || acc?.key || acc?.what || '')}" placeholder="${esc(L.accHint[acc?.type || 'manual'])}">
    </div>
    <div class="dk-acts"><button class="btn primary tf-create">${esc(L.taskCreate)}</button>
      <button class="dk-btn tf-cancel">${esc(L.taskCancel)}</button></div>
  </div>`

  const turnTailHTML = (t, i) => {
    // An answer is not work, but it is often where work is decided.
    if (t.kind === 'ask') {
      return t.task ? `<div class="dk-task"><b>${esc(L.taskOpened)}</b>
          <span class="st ${esc(t.task.state)}">${esc(L.taskState[t.task.state] || t.task.state)}</span>
          <span class="dk-hint">${esc(t.task.declinedReason || L.taskNothingRuns)}</span></div>`
        : `<div class="dk-acts"><button class="dk-btn dk-make" data-i="${i}">${esc(L.makeTask)}</button></div>`
    }
    if (t.task) return `<div class="dk-task"><b>${esc(L.taskOpened)}</b>
      <span class="st ${esc(t.task.state)}">${esc(L.taskState[t.task.state] || t.task.state)}</span>
      <span class="dk-hint">${esc(t.task.declinedReason || L.taskNothingRuns)}</span></div>`
    if (t.decision) return `<div class="dk-note">${esc(t.decision)}</div>`
    if (t.kind === 'proposal') {
      return t.proposal?.noFixNeeded ? ''
        : `<div class="dk-acts"><button class="dk-btn dk-notnow" data-i="${i}">${esc(L.planNotNow)}</button></div>`
    }
    return `<div class="dk-acts"><button class="btn primary dk-agree" data-i="${i}">${esc(L.planAgree)}</button>
      <button class="dk-btn dk-notnow" data-i="${i}">${esc(L.planNotNow)}</button></div>`
  }
  const KQ = { instruct: () => L.modeInstruct, proposal: () => L.modePropose }
  const renderThreads = (toEnd) => {
    const mine = forKey(current?.key)
    dkThreads.innerHTML = mine.map((t, i) => t.kind === 'note'
      // A bare note is the whole turn: a reviewer's remark, no answer to render.
      ? `<div class="dk-t"><div class="dk-q"><span class="kq">${esc(L.modeNote)}</span>${esc(t.request)}</div></div>`
      : `<div class="dk-t">${t.request === null
        ? `<div class="dk-q"><span class="kq">${esc(KQ[t.kind]?.() || '')}</span>${esc(L.proposeAsked)}</div>`
        : `<div class="dk-q">${KQ[t.kind] ? `<span class="kq">${esc(KQ[t.kind]())}</span>` : ''}${esc(t.request)}</div>`}
        ${traceHTML(t.steps)}
        <div class="dk-a md">${mdToHtml(t.response)}</div>
        ${planHTML(t.plan)}${variantsHTML(t.proposal, i)}${turnTailHTML(t, i)}</div>`).join('')
    for (const b of dkThreads.querySelectorAll('.dk-agree, .dk-make')) {
      b.addEventListener('click', () => openTaskForm(b, mine[+b.dataset.i]))
    }
    for (const b of dkThreads.querySelectorAll('.dk-notnow')) b.addEventListener('click', () => notNow(mine[+b.dataset.i], b))
    for (const b of dkThreads.querySelectorAll('.dk-pick')) {
      b.addEventListener('click', () => pick(mine[+b.dataset.i], +b.dataset.v, b))
    }
    // Opening a thread should start at the question, not at the end of the last
    // answer; only a freshly arrived answer is worth scrolling to.
    dkThreads.scrollTop = toEnd ? dkThreads.scrollHeight : 0
  }

  // Both actions go through the server so the journal on disk stays the truth —
  // the page never holds a decision the terminal session cannot see.
  const decide = async (path, body, btn) => {
    const row = btn.closest('.dk-acts') || btn.parentElement
    for (const b of row.querySelectorAll('button')) b.disabled = true
    try {
      const d = await api(path, body)
      threads = d.threads || threads
      review = d.review || review
      renderThreads(true)
      renderTasks()
      refreshMarks()
    } catch (e) {
      dkErr.hidden = false
      dkErr.textContent = `${L.askFailed}: ${e.message}`
      for (const b of row.querySelectorAll('button')) b.disabled = false
    }
  }
  // The reviewer confirms what the task will actually say. A plan is a draft, and
  // an answer is not a spec at all — both are worth a look before they become work.
  const firstSentence = (text) => String(text || '').replace(/\s+/g, ' ').split(/(?<=[.!?])\s/)[0].slice(0, 220)
  const openTaskForm = (btn, t) => {
    const row = btn.closest('.dk-acts')
    const i = btn.dataset.i
    const spec = t.plan?.spec || firstSentence(t.response)
    const acc = t.plan?.acceptance || { type: 'manual', what: '' }
    row.outerHTML = taskFormHTML(i, spec, acc)
    const form = dkThreads.querySelector(`.dk-tf[data-i="${i}"]`)
    const type = form.querySelector('.tf-type')
    const val = form.querySelector('.tf-val')
    type.addEventListener('change', () => { val.placeholder = L.accHint[type.value] })
    form.querySelector('.tf-cancel').addEventListener('click', () => renderThreads())
    form.querySelector('.tf-create').addEventListener('click', (e) => {
      const spec2 = form.querySelector('.tf-spec').value.trim()
      const v = val.value.trim()
      if (!spec2 || !v) { (spec2 ? val : form.querySelector('.tf-spec')).focus(); return }
      const field = type.value === 'test' ? 'name' : type.value === 'manual' ? 'what' : 'key'
      decide('task', {
        anchor: t.anchor, anchorKey: t.anchorKey, from: t.requestId,
        ...(t.kind === 'proposal' ? { origin: 'proposal', finding: t.proposal?.finding || t.anchorKey } : {}),
        spec: spec2, acceptance: { type: type.value, [field]: v },
      }, e.target)
    })
    form.querySelector('.tf-spec').focus()
  }
  const notNow = (t, btn) => decide('note', {
    anchor: t.anchor, anchorKey: t.anchorKey, replyTo: t.requestId, text: L.planDeclined,
  }, btn)
  // A chosen option is what the task's spec becomes — the reviewer picked which
  // kind of answer this finding gets, and the task carries the finding with it.
  const pick = (t, vi, btn) => {
    const v = t.proposal?.variants?.[vi]
    if (!v) return
    return decide('task', {
      anchor: t.anchor, anchorKey: t.anchorKey, from: t.requestId,
      origin: 'proposal', finding: t.proposal.finding || t.anchorKey,
      spec: v.what, acceptance: v.acceptance,
    }, btn)
  }
  function openFor(anchor) {
    current = anchor
    const fixable = canPropose(anchor)
    // Show the Options tab only where the map found something to weigh options about
    // (a finding, a test gap, a broken/partial story). A disabled-but-visible tab just
    // read as broken; hidden elsewhere it stops puzzling people.
    proposeBtn.hidden = !fixable
    proposeBtn.title = L.modeProposeTitle
    if (!fixable && mode === 'propose') setMode('ask')
    layoutEl.classList.add('chatting')
    revealAside()
    panel.classList.add('on')
    // A thread whose place is gone still reads; it must say so rather than look
    // like a remark about whatever now sits at that key.
    const stale = forKey(anchor.key).some(t => t.anchor?.stale)
    dkAnchor.innerHTML = `${esc(`${anchor.kind} · ${anchor.label}`.slice(0, 220))}${stale ? ` <span class="stale" title="${esc(L.staleWhy)}">${esc(L.staleTag)}</span>` : ''}`
    dkQuote.hidden = !anchor.quote
    dkQuote.textContent = anchor.quote || ''
    dkErr.hidden = true
    renderThreads()
    layoutRail()
    dkText.focus()
  }

  const send = async () => {
    const question = dkText.value.trim()
    // In Options mode the finding is the input, so there is nothing to type.
    if ((!question && mode !== 'propose') || !current || dkSend.disabled) return
    // A note is not an exchange — no model, no stream. Pin it and re-render.
    if (mode === 'note') {
      dkSend.disabled = true
      dkErr.hidden = true
      try {
        const d = await api('note', { anchor: current, anchorKey: current.key, kind: 'note', text: question })
        threads = d.threads || threads
        review = d.review || review
        dkText.value = ''
        renderThreads(true)
        renderTasks()
        refreshMarks()
      } catch (e) {
        dkErr.hidden = false
        dkErr.textContent = `${L.noteFailed}: ${e.message}`
      } finally { dkSend.disabled = false }
      return
    }
    const label = mode === 'propose' ? (current.label || current.key) : question
    const thinking = mode === 'ask' ? L.askThinking : mode === 'instruct' ? L.instructThinking : L.proposeThinking
    dkSend.disabled = true
    dkErr.hidden = true
    const row = document.createElement('div')
    row.className = 'dk-t'
    row.innerHTML = `<div class="dk-q">${mode === 'ask' ? '' : `<span class="kq">${esc(mode === 'instruct' ? L.modeInstruct : L.modePropose)}</span>`}${esc(mode === 'propose' ? L.proposeAsked : label)}</div>
      <details class="trace" open><summary><span class="spin"></span> ${esc(thinking)}</summary>
        <div class="tr-body"><div class="tr-steps"></div><div class="tr-live"></div></div></details>
      <div class="dk-a md"></div>`
    dkThreads.appendChild(row)
    dkThreads.scrollTop = dkThreads.scrollHeight
    const elSteps = row.querySelector('.tr-steps')
    const elLive = row.querySelector('.tr-live')
    const elTrace = row.querySelector('.trace')
    const elSum = row.querySelector('summary')
    let steps = 0, live = '', gotDelta = false
    try {
      const res = mode === 'ask'
        ? await api('ask', { anchor: current, anchorKey: current.key, question }, true)
        : mode === 'instruct'
          ? await api('instruct', { anchor: current, anchorKey: current.key, instruction: question }, true)
          : await api('propose', { anchor: current, anchorKey: current.key, finding: label }, true)
      const reader = res.body.getReader()
      const dec = new TextDecoder()
      let buf = ''
      for (;;) {
        const { done, value } = await reader.read()
        if (done) break
        buf += dec.decode(value, { stream: true })
        const lines = buf.split('\n')
        buf = lines.pop()
        for (const line of lines) {
          if (!line.trim()) continue
          let ev
          try { ev = JSON.parse(line) } catch { continue }
          if (ev.kind === 'step') {
            steps++
            const d = document.createElement('div')
            d.className = 'tr-step'
            d.textContent = ev.text
            elSteps.appendChild(d)
            elSum.innerHTML = `<span class="spin"></span> ${esc(L.askWorking(steps))}`
          } else if (ev.kind === 'delta') {
            gotDelta = true
            live += ev.text
            elLive.textContent = live.slice(-600)
            elLive.scrollTop = elLive.scrollHeight
          } else if (ev.kind === 'text' && !gotDelta) {
            live = ev.text
            elLive.textContent = live.slice(-600)
          } else if (ev.kind === 'done') {
            threads.push(ev.turn)
            // The trace did its job while waiting; fold it away now that the
            // answer is here, but keep it one click from view.
            elTrace.open = false
            elSum.textContent = L.askTrace(ev.turn.steps?.length || steps)
            if (!ev.turn.steps?.length && !steps) elTrace.remove()
            elLive.remove()
            row.querySelector('.dk-a').innerHTML = mdToHtml(ev.turn.response)
            dkText.value = ''
            refreshMarks()
            // A plan brings its fields and its decision buttons, which have to be
            // wired — so the whole thread is re-rendered rather than patched.
            if (ev.turn.kind !== 'ask') renderThreads(true)
            dkThreads.scrollTop = dkThreads.scrollHeight
          } else if (ev.kind === 'error') throw new Error(ev.error)
        }
      }
    } catch (e) {
      row.remove()
      dkErr.hidden = false
      dkErr.textContent = `${mode === 'ask' ? L.askFailed : mode === 'instruct' ? L.instructFailed : L.proposeFailed}: ${e.message}`
    } finally { dkSend.disabled = false }
  }
  dkSend.addEventListener('click', send)
  dkText.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return
    // Enter sends, Shift+Enter is a newline — the convention every chat box has.
    // ⌘/Ctrl+Enter keeps working for the muscle memory it was trained on.
    if (e.shiftKey) return
    e.preventDefault()
    send()
  })

  // ── Tasks: the one tab that answers "can this be merged" ───────────────────
  // Built here, not in the template, so the standalone file and the published
  // artifact have no tab at all — absent rather than empty, the way the ask UI is.
  let review = null
  const tkPane = document.createElement('div')
  tkPane.id = 'pane-tasks'
  tkPane.className = 'pane'
  tkPane.hidden = true
  tkPane.innerHTML = `<div class="tkhead-row"><h2>${esc(L.reviewTitle)}</h2>
      <button class="dk-btn tk-copy">${esc(L.tasksCopy)}</button><span class="dk-hint tk-said"></span></div>
    <div class="statline" id="tkVerdict"></div>
    <div id="tkGroups"></div>`
  document.querySelector('.main-panel').appendChild(tkPane)
  // Not a tab. The report answers "what does this change mean"; the review answers
  // "what is still unsettled" — a different job, on a different kind of page, so it
  // gets its own destination instead of hiding among the report's tabs.
  PANES.push(['tasks', L.tabs.tasks, ''])
  // Report and Review are the two top-level modes, so they are a segmented switch
  // that sits above the report's sub-tabs — peers, not one more tab in the strip.
  const modebar = document.createElement('div')
  modebar.className = 'modebar'
  modebar.setAttribute('role', 'tablist')
  const reportTab = document.createElement('button')
  reportTab.className = 'modetab active'
  reportTab.textContent = L.reviewBack
  const reviewTab = document.createElement('button')
  reviewTab.className = 'modetab'
  reviewTab.title = L.reviewOpenTitle
  reviewTab.innerHTML = `${esc(L.reviewOpen)} <span class="cnt"></span>`
  modebar.append(reportTab, reviewTab)
  // Above the board, not inside it: the mode switch chooses which page you are on,
  // the tabbed card is that page.
  const boardEl = document.querySelector('.board')
  boardEl.parentNode.insertBefore(modebar, boardEl)
  let lastReportTab = 'story'
  const markMode = (on) => {
    reportTab.classList.toggle('active', !on)
    reviewTab.classList.toggle('active', on)
  }
  const setReviewing = (on) => {
    document.body.classList.toggle('reviewing', on)
    markMode(on)
    if (on) setTab('tasks')
    else setTab(lastReportTab)
  }
  reportTab.addEventListener('click', () => setReviewing(false))
  reviewTab.addEventListener('click', () => setReviewing(true))
  // Any move back into the report leaves review mode, including a jump from a card.
  const wrappedSetTab = setTab
  setTab = (id) => {
    if (id !== 'tasks') {
      lastReportTab = id
      document.body.classList.remove('reviewing')
      markMode(false)
    }
    wrappedSetTab(id)
  }
  const tkVerdict = tkPane.querySelector('#tkVerdict')
  const tkGroups = tkPane.querySelector('#tkGroups')
  const tkSaid = tkPane.querySelector('.tk-said')

  // Grouped by where the problem came from, not by status: an instruction of your
  // own and a defect the map found are different kinds of work, and the same
  // status on both says nothing. Proposal-born tasks name their finding.
  const GROUPS = ['questions', 'reviewer', 'story', 'standards', 'tests', 'other']
  const sourceOf = (t) => {
    if (t.origin === 'reviewer') return 'reviewer'
    const kind = String(t.finding || '').split(':')[0]
    return kind === 'gap' ? 'tests' : kind === 'story' ? 'story' : kind === 'finding' ? 'standards' : 'other'
  }
  // Blocking first, terminal last — a column of cards has to read as a queue.
  const RANK = { open: 0, in_progress: 0, proposed: 1, done: 2, verified: 3, declined: 4 }
  const tabOfKey = (key) => tabOfEl(elFor(key))

  // The patch a worked task produced, read as a change rather than as a claim that
  // one was made. It is not in the reviewer's tree until they apply it.
  const patchHTML = (files, applied) => {
    const headline = applied ? L.tasksApplied : L.tasksPatch(files.length)
    // Hunks exist only for a patch this page just watched being produced; a task
    // loaded from the journal has file names and nothing to expand.
    const expandable = files.some(f => f.hunks?.length)
    return `<div class="tkpatch">
    <div class="tkpline"><b>${esc(headline)}</b>
      ${expandable ? `<button class="dk-btn tk-toggle">${esc(L.tasksShowPatch)}</button>` : ''}
      ${applied ? '' : `<button class="btn primary tk-apply">${esc(L.tasksApply)}</button>`}</div>
    <div class="tkfiles" hidden>${files.map(f => `<div class="tkfile">
      <div class="tkfhead"><code>${esc(f.path)}</code>${f.hunks ? `<span class="tkfn">+${f.add} −${f.del}${f.isNew ? ' · new' : ''}</span>` : ''}</div>
      <div class="frag">${(f.hunks || []).map(([cls, text]) => `<div class="cl ${esc(cls)}">${esc(text)}</div>`).join('')}</div>
    </div>`).join('')}</div></div>`
  }

  const staleTag = (a) => a?.stale ? ` <span class="stale" title="${esc(L.staleWhy)}">${esc(L.staleTag)}</span>` : ''
  const cardHTML = (t, applied) => `<div class="tkcard ${esc(t.state)}" data-id="${esc(t.taskId)}">
    <div class="tkhead"><span class="st ${esc(t.state)}">${esc(L.taskState[t.state] || t.state)}</span>
      <b class="tk-open" data-key="${esc(t.anchor.key)}" title="${esc(String(t.spec).replace(/<[^>]+>/g, ''))}">${prose(t.spec)}</b></div>
    <div class="tkmeta">${esc(L.planAcceptance)}: ${esc(accText(t.acceptance))} · ${prose(t.anchor.label || t.anchor.key)}${staleTag(t.anchor)}${t.declinedReason ? ` · ${prose(t.declinedReason)}` : ''}</div>
    <div class="tkrow">
      ${t.state === 'declined' ? `<button class="dk-btn tk-reopen">${esc(L.tasksReopen)}</button>`
        : RANK[t.state] <= 1 ? `<button class="dk-btn tk-decline">${esc(L.tasksDecline)}</button>` : ''}
      ${RANK[t.state] === 0 ? `<button class="dk-btn tk-run"${SERVE.work ? '' : ' disabled'} title="${esc(SERVE.work ? L.tasksWork : L.tasksWorkOff)}">${esc(L.tasksWork)}</button>` : ''}
    </div>
    ${t.resolution?.files?.length ? patchHTML(t.resolution.files.map(p => ({ path: p })), applied.has(t.taskId)) : ''}
    <div class="tkwork" hidden></div></div>`
  const questionHTML = (n) => `<div class="tkcard open">
    <div class="tkhead"><span class="st open">${esc(L.tasksGroup.questions[0])}</span>
      <b class="tk-open" data-key="${esc(n.anchor.key)}" title="${esc(n.text)}">${prose(n.text)}</b></div>
    <div class="tkmeta">${prose(n.anchor.label || n.anchor.key)}${staleTag(n.anchor)}</div></div>`

  const renderTasks = () => {
    if (!review) return
    const c = review.counts
    const applied = new Set(review.notes.filter(n => n.applied && n.taskId).map(n => n.taskId))
    const parts = [c.blocking ? `<span class="hot"><b>${esc(L.tasksBlocking(c.blocking))}</b></span>` : `<b>${esc(L.tasksNothingBlocking)}</b>`]
    for (const k of ['proposed', 'done', 'verified', 'declined']) if (c[k]) parts.push(esc(L.tasksCount[k](c[k])))
    // The decision manifest, next to the file manifest in spirit: every problem the
    // map reported either has a decision or is openly counted as undecided.
    const cov = review.coverage
    if (cov?.total) parts.push(esc(L.tasksDecided(cov.decided, cov.total)))
    tkVerdict.innerHTML = parts.join('<span class="vsep">·</span>')
    // The badge counts what blocks, not what exists, and says so by colour: this
    // tab is a gate, and a neutral number would read as "nothing to do here".
    const cnt = reviewTab.querySelector('.cnt')
    // What this page is for: what blocks, what nobody decided, and what is waiting
    // to be applied. A count that ignored any of the three would send you elsewhere.
    const waiting = review.tasks.filter(t => t.state === 'done' && !applied.has(t.taskId)).length
    const needsDecision = c.blocking + (review.coverage?.open?.length || 0) + waiting
    cnt.textContent = needsDecision || ''
    cnt.className = 'cnt' + (c.blocking ? ' hot' : '')

    const bucket = {}
    const settled = []
    for (const n of review.notes) if (n.kind === 'question' && !n.answered) (bucket.questions ||= []).push(questionHTML(n))
    // `done` is not finished: a patch that is not in your tree yet is the most
    // actionable thing on this page, so it stays in the open list and only folds
    // away once it has been applied. Verified and declined are history.
    const openStill = (t) => RANK[t.state] <= 1 || (t.state === 'done' && !applied.has(t.taskId))
    for (const t of [...review.tasks].sort((a, b) => (RANK[a.state] - RANK[b.state]) || a.openedAt.localeCompare(b.openedAt))) {
      if (openStill(t)) (bucket[sourceOf(t)] ||= []).push(cardHTML(t, applied))
      else settled.push(cardHTML(t, applied))
    }
    const html = GROUPS.filter(g => bucket[g]?.length).map(g => {
      // Heading only: the one-line "why" under each group was prose nobody re-reads,
      // and it lives in the ? panel for whoever wants it.
      const [name] = L.tasksGroup[g]
      return `<section class="tkgroup"><h3>${esc(name)} <span class="cnt">${bucket[g].length}</span></h3>${bucket[g].join('')}</section>`
    }).join('')
    // Undecided findings are listed, not just counted: a number nobody can act on
    // is the same as no manifest at all.
    const undecided = cov?.open?.length
      ? `<section class="tkgroup"><h3>${esc(L.tasksUndecided)} <span class="cnt">${cov.open.length}</span></h3>
          ${cov.open.map(f => `<div class="tkcard undecided">
            <div class="tkhead"><span class="st proposed">${esc(f.kind)}</span>
              <b class="tk-open" data-key="${esc(f.key)}" title="${esc(String(f.text).replace(/<[^>]+>/g, ''))}">${prose(f.text)}</b></div></div>`).join('')}
        </section>`
      : ''
    const decided = settled.length
      ? `<details class="tkdone"><summary>${esc(L.tasksDone(settled.length))}</summary>${settled.join('')}</details>`
      : ''
    tkGroups.innerHTML = (html + undecided + decided) || `<p class="pane-hint">${esc(L.tasksEmpty)}</p>`

    for (const b of tkGroups.querySelectorAll('.tk-open')) {
      // The whole line is the way in: a per-row button repeated six times was the
      // page's loudest element and its least informative one.
      b.addEventListener('click', () => jumpTo({ key: b.dataset.key, tab: tabOfKey(b.dataset.key) }))
    }
    for (const b of tkGroups.querySelectorAll('.tk-run')) {
      if (!b.disabled) b.addEventListener('click', () => work(b.closest('.tkcard'), b))
    }
    for (const b of tkGroups.querySelectorAll('.tk-apply')) {
      b.addEventListener('click', () => apply(b.closest('.tkcard'), b))
    }
    for (const b of tkGroups.querySelectorAll('.tk-toggle')) {
      b.addEventListener('click', () => {
        const box = b.closest('.tkpatch').querySelector('.tkfiles')
        box.hidden = !box.hidden
        b.textContent = box.hidden ? L.tasksShowPatch : L.tasksHidePatch
      })
    }
    for (const b of tkGroups.querySelectorAll('.tk-reopen')) {
      b.addEventListener('click', () => taskState(b.closest('.tkcard').dataset.id, 'open'))
    }
    // Declining asks for the reason on the spot: the journal refuses a decline
    // without one, and a reason nobody has to type is a reason nobody reads.
    for (const b of tkGroups.querySelectorAll('.tk-decline')) {
      b.addEventListener('click', () => {
        const row = b.closest('.tkrow')
        row.innerHTML = `<input class="tk-why" placeholder="${esc(L.tasksDeclineWhy)}">
          <button class="dk-btn tk-do" disabled>${esc(L.tasksDeclineDo)}</button>`
        const input = row.querySelector('.tk-why')
        const go = row.querySelector('.tk-do')
        input.addEventListener('input', () => { go.disabled = !input.value.trim() })
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && input.value.trim()) go.click() })
        go.addEventListener('click', () => taskState(row.closest('.tkcard').dataset.id, 'declined', input.value.trim()))
        input.focus()
      })
    }
  }

  // Working a task: an agent edits a throwaway copy of the tree and hands back a
  // patch. The steps show while it runs, because a silent minutes-long wait on
  // something that spends money is not a progress indicator.
  const work = async (card, btn) => {
    const taskId = card.dataset.id
    btn.disabled = true
    const box = card.querySelector('.tkwork')
    box.hidden = false
    box.innerHTML = `<details class="trace" open><summary><span class="spin"></span> ${esc(L.tasksWorking)}</summary>
      <div class="tr-body"><div class="tr-steps"></div><div class="tr-live"></div></div></details>`
    const elSteps = box.querySelector('.tr-steps')
    const elLive = box.querySelector('.tr-live')
    let live = '', gotDelta = false, steps = 0
    try {
      const res = await api('work', { taskId }, true)
      const reader = res.body.getReader()
      const dec = new TextDecoder()
      let buf = ''
      for (;;) {
        const { done, value } = await reader.read()
        if (done) break
        buf += dec.decode(value, { stream: true })
        const lines = buf.split('\n')
        buf = lines.pop()
        for (const line of lines) {
          if (!line.trim()) continue
          let ev
          try { ev = JSON.parse(line) } catch { continue }
          if (ev.kind === 'step') {
            steps++
            const d = document.createElement('div')
            d.className = 'tr-step'
            d.textContent = ev.text
            elSteps.appendChild(d)
            box.querySelector('summary').innerHTML = `<span class="spin"></span> ${esc(L.askWorking(steps))}`
          } else if (ev.kind === 'delta') {
            gotDelta = true
            live += ev.text
            elLive.textContent = live.slice(-600)
          } else if (ev.kind === 'text' && !gotDelta) {
            elLive.textContent = ev.text.slice(-600)
          } else if (ev.kind === 'done') {
            review = ev.review || review
            threads = ev.threads || threads
            renderTasks()
            // The report is worth reading whether or not anything changed.
            const fresh = tkGroups.querySelector(`.tkcard[data-id="${CSS.escape(taskId)}"]`)
            if (fresh) {
              const w = fresh.querySelector('.tkwork')
              w.hidden = false
              w.innerHTML = `<div class="dk-a md">${mdToHtml(ev.report || '')}</div>
                ${ev.empty ? `<div class="dk-note">${esc(L.tasksWorkEmpty)}</div>` : ''}`
              if (!ev.empty && ev.files?.length) {
                fresh.querySelector('.tkpatch')?.remove()
                w.insertAdjacentHTML('beforebegin', patchHTML(ev.files, false))
                fresh.querySelector('.tk-apply').addEventListener('click', (e) => apply(fresh, e.target))
                fresh.querySelector('.tk-toggle').addEventListener('click', (e) => {
                  const list = fresh.querySelector('.tkfiles')
                  list.hidden = !list.hidden
                  e.target.textContent = list.hidden ? L.tasksShowPatch : L.tasksHidePatch
                })
              }
            }
          } else if (ev.kind === 'error') throw new Error(ev.error)
        }
      }
    } catch (e) {
      box.innerHTML = `<div class="dk-err">${esc(L.tasksWorkFailed)}: ${esc(e.message)}</div>`
      btn.disabled = false
    }
  }

  // Re-work a task whose patch no longer fits: reopen it (which discards the stale
  // resolution) and run the worker again, so it rebases on the tree as it stands now.
  const rerun = async (taskId) => {
    try {
      const d = await api('task-state', { taskId, state: 'open' })
      review = d.review || review
      threads = d.threads || threads
      renderTasks()
      const card = tkGroups.querySelector(`.tkcard[data-id="${CSS.escape(taskId)}"]`)
      card?.querySelector('.tkpatch')?.remove()   // the stale patch is about to be replaced
      const run = card?.querySelector('.tk-run')
      if (card && run && !run.disabled) work(card, run)
    } catch (e) { console.error('re-run failed:', e) }
  }

  const apply = async (card, btn) => {
    btn.disabled = true
    try {
      const d = await api('apply', { taskId: card.dataset.id })
      review = d.review || review
      threads = d.threads || threads
      renderTasks()
      refreshMarks()
    } catch (e) {
      // The tree moved on since this task was worked: offer to re-work it against the
      // tree as it stands, which the gate can then apply. Already-applied is not a
      // failure — say so plainly. Anything else is a real error.
      if (e.data?.movedOn) {
        const span = document.createElement('span')
        span.className = 'tk-moved'
        span.innerHTML = `<span class="dk-note">${esc(L.tasksMovedOn)}</span> <button class="dk-btn tk-rerun">${esc(L.tasksRerun)}</button>`
        btn.replaceWith(span)
        span.querySelector('.tk-rerun').addEventListener('click', () => rerun(card.dataset.id))
      } else if (e.data?.applied) {
        btn.replaceWith(Object.assign(document.createElement('span'), { className: 'dk-note', textContent: L.tasksAlreadyApplied }))
      } else {
        btn.insertAdjacentHTML('afterend', `<span class="dk-err">${esc(L.tasksApplyFailed)}: ${esc(e.message)}</span>`)
        btn.disabled = false
      }
    }
  }

  const taskState = async (taskId, state, reason) => {
    try {
      const d = await api('task-state', { taskId, state, reason })
      review = d.review || review
      threads = d.threads || threads
      renderTasks()
      if (current) renderThreads()
      refreshMarks()
    } catch (e) { tkSaid.textContent = e.message }
  }

  // The handoff: nothing here executes, so what the tab can do is hand the queue
  // to the session that does. Text, not a file, because pasting is the shortest
  // path from a decision to work starting.
  tkPane.querySelector('.tk-copy').addEventListener('click', async () => {
    const queue = (review?.tasks || []).filter(t => RANK[t.state] === 0)
    if (!queue.length) { tkSaid.textContent = L.tasksCopyNothing; return }
    const text = [
      `Work the whydiff review queue in ${SERVE.repo} — use the whydiff-work skill (/whydiff:whydiff-work).`,
      SERVE.journal ? `The review journal is ${SERVE.journal}; read the discussion behind each task with \`review.mjs --thread <id>\`.` : '',
      '',
      ...queue.map((t, i) => [
        `${i + 1}. [${t.taskId}] ${t.spec}`,
        `   proved done by: ${accText(t.acceptance)}`,
        `   discussed at: ${t.anchor.label || t.anchor.key}`,
        t.anchor.files?.length ? `   files: ${t.anchor.files.join(', ')}` : '',
      ].filter(Boolean).join('\n')),
      '',
      'Do them one at a time, in order, and report back. Only close a criterion you actually ran.',
    ].filter((l) => l !== undefined).join('\n')
    try { await navigator.clipboard.writeText(text) } catch {
      const ta = document.createElement('textarea')
      ta.value = text
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove()
    }
    tkSaid.textContent = L.tasksCopied
  })

  api('threads').then((d) => { threads = d.threads || []; refreshMarks() }).catch(() => refreshMarks())
  api('review').then((d) => { review = d; renderTasks() }).catch((e) => console.error('review load failed:', e))
})()
</script>
